# Base config for the densMAP baseline DENSITY-STRENGTH sweep on C. elegans.
#
# Fair analog of the DiffTree density_weight sweep: varies the density-
# preservation strength (dens_lambda) passed to umap.UMAP(densmap=True), so
# densMAP is tuned on the same axis DiffTree is, not only on structural params.
#
# NOTE: requires the baseline_tri.py change that forwards dens_lambda/dens_frac
# into umap.UMAP(...). Before that change densMAP ignored dens_lambda and this
# sweep axis would be a silent no-op.
#
# Swept by baseline_density_strength_sweep_celegan.yaml:
#   p1          = n_neighbors  [10, 15, 20, 40, 80, 120]   (structural axis)
#   dens_lambda = density-preservation strength             (density axis)
# Fixed here:
#   p2          = min_dist index 2 -> 0.05
#   dens_frac   = 0.3
# umap densMAP default dens_lambda = 2.0.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_celegan.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data
    pca_dim: 64
    batch_size: 54649
    num_workers: 0
    K: 50
    n_hop: 1
    include_time_label: true
    exclude_unannotated: true
    standardize: true
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _densmap
    data_name: celegan
    num_input_dim: 2766
    n_components: 2
    p1: 1
    p2: 2
    p3: 0
    dens_lambda: 2.0
    dens_frac: 0.3
    random_state: 42
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: cs_hpsweep_densmap_denslambda_celegan
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/case_study_hpsweep/celegan/densmap_denslambda
      every_n_epochs: 1
  - class_path: callbacks.xc_plot_heterogeneity.HeterogeneityPlotCallback
    init_args:
      output_dir: outputs/case_study_hpsweep/celegan/densmap_denslambda/heterogeneity
      every_n_epochs: 1
      target_label: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
