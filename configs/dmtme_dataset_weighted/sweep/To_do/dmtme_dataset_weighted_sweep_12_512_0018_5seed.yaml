program: main.py
method: grid
project: DiffTree_rz
name: dmtme_dataset_weighted_12_512_0018_5seed

parameters:
  config:
    values:
      - 'configs/dmtme_dataset_weighted/ACT.yaml'
      - 'configs/dmtme_dataset_weighted/EMNIST.yaml'
      - 'configs/dmtme_dataset_weighted/HCL.yaml'
      - 'configs/dmtme_dataset_weighted/MCA.yaml'
      - 'configs/dmtme_dataset_weighted/NG20.yaml'
      - 'configs/dmtme_dataset_weighted/aqc.yaml'
      - 'configs/dmtme_dataset_weighted/epi.yaml'
      - 'configs/dmtme_dataset_weighted/gast10k.yaml'

  seed_everything:
    values: [42, 43, 44, 45, 46]

  model.init_args.density_k:
    values: [12]

  model.init_args.density_num_anchors:
    values: [512]

  model.init_args.density_weight:
    values: [0.0018]

  model.init_args.max_epochs:
    values: [1000]

  trainer.max_epochs:
    values: [1000]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
