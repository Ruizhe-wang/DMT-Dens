# Stage A: NG20 comparison of the four encoders at seed 42.
#
# Run this only on code at or after 3f03455, which restored the row-normalized Q
# in the manifold loss. Runs made between f9644c7 and that commit sit on a
# broken baseline (NG20 density correlation 0.21-0.35 instead of 0.74) and are
# not comparable with these; the sweep name carries the distinction.
#
# The learning-rate search and the NG20 comparison are the same 12 runs: every
# architecture, the baseline included, gets the identical three candidates
# (fairness rule 1). The winner per architecture is then fixed for ACT/MNIST by
# filling SELECTED_LR in generate_configs.py and regenerating.
#
# ng20_latent_transformer_full.yaml is the capacity control and is deliberately
# not part of these four; append it here when that comparison is wanted.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_lr_seed42_fixed_baseline

parameters:
  config:
    values:
      # The baseline takes part in the same search: fairness rule 1 requires an
      # identical learning-rate search range for every model, so the MLP must
      # not keep a pre-tuned advantage.
      - configs/encoder_bench/ng20_mlp.yaml
      - configs/encoder_bench/ng20_resmlp.yaml
      - configs/encoder_bench/ng20_ft_transformer.yaml
      - configs/encoder_bench/ng20_latent_transformer.yaml
  model.init_args.lr:
    values:
      - 0.005
      - 0.001
      - 0.0003

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
