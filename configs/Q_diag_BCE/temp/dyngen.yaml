# Formal Q-diagonal/BCE experiment: dynGen fate
seed_everything: 42

data:
  class_path: data_model.M1datamodel_dyngen_fate.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/zelin181data/sclineage/single-cell-lineage1/data/figure3_fate/dyngen
    h5ad_file: fig3_fate_dyngen_shared_dynGenZL10k_hyperbranch_v2_seed42.h5ad
    label_key: fig3_true_terminal
    state_key: fig3_true_state
    time_key: fig3_true_time
    branch_key: true_branch
    top_genes: null
    pca_dim: 64
    seed: 42
    sample_data_size: 10000
    batch_size: 1000
    num_workers: 4
    K: 1000
    n_hop: 1
    minmax_scale: true

model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 3328
    num_train_data: 10000
    lr: 0.005
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 1.4023242477333635
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.0005022134157131928
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 1000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: false
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-6
    manifold_affinity: rank
    manifold_symmetric: bidirectional
    manifold_hardpair: true
    hardpair_k: 100
    t_mul: 1.0
    num_use_mlevel_list: [1]
    density_weight: 0.015039793306202896
    density_k: 12
    density_num_anchors: 384
    density_scale_mode: multi

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 100
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: q_diag_bce_dyngen
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/Q_diag_BCE/checkpoints/dyngen
        filename: q-diag-bce-dyngen-{epoch:04d}
        save_last: true
        every_n_epochs: 100
    - class_path: callbacks.manifold_diagnostics.ManifoldDiagnosticsCallback
      init_args:
        every_n_steps: 1
        log_every_n_epochs: 1
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: outputs/Q_diag_BCE/plots/dyngen
        every_n_epochs: 100
    - class_path: callbacks.Eval_density.FidelityEvalCallback
      init_args:
        every_n_epochs: 50
        down_sample: 3000
        knn_k: 12
        density_k: 15
    - class_path: callbacks.dyngen_gt_metrics_callback.DyngenGroundTruthMetricsCallback
      init_args:
        every_n_epochs: 100
        pca_dim: 50
        time_key: pseudotime
        from_key: from
        to_key: to
        terminal_key: final_annotation
        fate_prefix: fate_prob_
        demap_landmarks: 1000
        demap_knn: 15
        prefix: gt
