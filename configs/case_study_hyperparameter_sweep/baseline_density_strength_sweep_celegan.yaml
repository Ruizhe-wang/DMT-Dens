# Case-study DENSITY-STRENGTH sweep: density-preserving BASELINES on C. elegans.
#
# Purpose: give the density-preserving baselines (densNE, densMAP) a
# hyperparameter search over their OWN density-preservation strength
# (dens_lambda) -- the fair analog of the DiffTree density_weight sweep in
# difftree_sweep_celegan.yaml. The existing baseline_sweep_celegan.yaml only
# tunes structural params (perplexity / n_neighbors x exaggeration / min_dist)
# and leaves density strength at each method's default, which is NOT comparable
# to how DiffTree is tuned. This sweep closes that gap.
#
# Only the dens* family exposes a density-strength knob; t-SNE / UMAP / PaCMAP /
# PHATE have none, so they are not included here (their structural sweep in
# baseline_sweep_celegan.yaml is the full search for them).
#
# Requires the model/baseline_tri.py change exposing dens_lambda/dens_frac as
# constructor args and forwarding dens_lambda into umap.UMAP for densMAP.
#
# Axes:
#   p1          = structural index [0..5]
#                   densNE           -> perplexity  [15, 30, 50, 80, 120, 200]
#                   densMAP          -> n_neighbors [10, 15, 20, 40, 80, 120]
#   dens_lambda = density-preservation strength
#                   spans weak -> strong; covers densNE backend default (0.1)
#                   and umap densMAP default (2.0) within range.
# Fixed: p2 (secondary structural param) and dens_frac=0.3 in each base config.
#
# Grid size: 2 methods x 6 (p1) x 6 (dens_lambda) = 72 runs (1 CPU epoch each).
#
# Run:
#   wandb sweep configs/case_study_hyperparameter_sweep/baseline_density_strength_sweep_celegan.yaml
#   wandb agent <entity>/DiffTree_rz/<sweep_id>

program: main.py
method: grid
project: DiffTree_rz
name: cs_hpsweep_baselines_denslambda_celegan

parameters:
  config:
    values:
      - configs/case_study_hyperparameter_sweep/baseline_densne_denslambda_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densmap_denslambda_celegan.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4, 5]

  model.init_args.dens_lambda:
    values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
