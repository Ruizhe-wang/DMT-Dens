# E11: isolate the E10 normalization mechanism and confirm its winners
# on seeds 43/44. A6/A7 are seed 42; the rest are seed confirmations.
# Each run config owns its checkpoint, plot, runtime-CSV and
# runtime-info paths so concurrent agents cannot share directories.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e11_input_norm_and_seeds
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e11/runs/ng20_latent_m32_r16_nodrop_inputbn_lr0p005_seed42.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_latent_m32_r16_nodrop_inputbn_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_inputbn_lr0p005_seed42.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_inputbn_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_bn_lr0p005_seed43.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_bn_lr0p001_seed43.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_bn_lr0p005_seed44.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_resmlp_bn_lr0p001_seed44.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_latent_m32_r16_nodrop_bn_input_lr0p001_seed43.yaml
      - configs/encoder_bench/sweep_e11/runs/ng20_latent_m32_r16_nodrop_bn_input_lr0p001_seed44.yaml
