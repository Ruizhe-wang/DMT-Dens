# - lg_distance_weight：距离保持项，保留全局结构
# - lg_position_weight：位置保持项，保留局部位置（ >=1.0 会崩溃）
program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_warmup_pos_dist_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]

  model.lg_warmup_epochs:
    values: [0, 20, 50]

  # 距离保持权重
  model.lg_distance_weight:
    values: [0.5, 1.0, 2.0]

  # 位置保持权重（已知 >=1.0 不稳定，重点探索低区间）
  model.lg_position_weight:
    values: [0.0, 0.1, 0.2, 0.5]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
