# [5seed-rep] UMAP on dynGen fate at BEST config (p1=2, p2=4 -> n_neighbors=20, min_dist=0.15).
# Selected by val_score (a GT-free criterion) from the baseline hyperparameter sweep
#   results: D:/ruizhe/result/case_study/dyngen/cs_hpsweep_dyngen_baseline.csv
# Used by sweep/sweep_5seed_rep_dyngen.yaml; only seed_everything is swept.
# random_state is null so the backend RNG falls back to the global NumPy RNG that
# Lightning's seed_everything seeds -> varying seed_everything (41..45) varies it.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_dyngen_fate.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/zelin181data/sclineage/single-cell-lineage1/data/figure3_fate/dyngen
    h5ad_file: fig3_fate_dyngen_shared_dynGenZL10k_hyperbranch_v2_seed42.h5ad
    label_key: fig3_true_terminal
    state_key: fig3_true_state
    time_key: fig3_true_time
    branch_key: true_branch
    top_genes: null
    pca_dim: 64
    seed: 42
    sample_data_size: 10000
    batch_size: 10000
    num_workers: 4
    K: 50
    n_hop: 1
    minmax_scale: true
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _umap
    data_name: dyngen_fate
    num_input_dim: 3328
    n_components: 2
    p1: 2
    p2: 4
    p3: 0
    random_state: null
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: cs_5seedrep_umap_dyngen
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/case_study/dyngen_5seed_rep/umap
      every_n_epochs: 1
  - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
    init_args:
      dataset_name: dyngen_fate
      output_dir: outputs/embeddings
      save_format: both
      embedding_method_name: umap
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
  # Ground-truth trajectory metrics logged to wandb for the 5-seed comparison.
  - class_path: callbacks.dyngen_gt_metrics_callback.DyngenGroundTruthMetricsCallback
    init_args:
      every_n_epochs: 1
      pca_dim: 50
      time_key: pseudotime
      from_key: from
      to_key: to
      terminal_key: final_annotation
      fate_prefix: fate_prob_
      demap_landmarks: 1000
      demap_knn: 15
      prefix: gt
