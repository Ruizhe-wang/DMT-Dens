# E02: target the bottlenecks identified by the completed E01 capacity control.
#
# FT changes only pooling (CLS -> mean). Latent changes only tokenizer rank
# (4 -> 8 or 16). Width, depth, heads, dropout, batch, objective, projection
# head, callbacks and seed remain fixed. Every architecture receives the same
# three learning-rate candidates.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e02_architecture_seed42

parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e02/runs/ng20_ft_transformer_wide_mean_lr0p005.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_ft_transformer_wide_mean_lr0p001.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_ft_transformer_wide_mean_lr0p0003.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r8_lr0p005.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r8_lr0p001.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r8_lr0p0003.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r16_lr0p005.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r16_lr0p001.yaml
      - configs/encoder_bench/sweep_e02/runs/ng20_latent_transformer_wide_r16_lr0p0003.yaml

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
