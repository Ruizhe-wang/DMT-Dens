# =============================================================================
# Baseline t-SNE Configuration for Local-Global Consistency Evaluation
# Dataset: Tea Category (column 1)
# Usage: python main.py fit -c conf/consistency_eval/baseline_tsne_tea_category.yaml
# =============================================================================
#
# Tea Category Label Mapping (column 1, 6 classes):
#   -3, -2, -1, 0, 1, 2
#
# 342 samples, 36504-dim features (8 sensors x 4563 max time steps, zero-padded)
# =============================================================================

seed_everything: 42

data:
  class_path: data_model.M1datamodel_tea.DMTBaseDataModule
  init_args:
    pca_dim: 50
    batch_size: 342
    num_workers: 4
    K: 10
    n_hop: 1
    label_key: tea_category
    data_path: data

model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: '_tsne'
    data_name: 'tea_category'
    num_input_dim: 36504  # 8 sensors x 4563 max time steps
    n_components: 2
    p1: 2
    p2: 2
    p3: 0

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: baseline_tsne_tea_category_consistency
      project: CONSISTENCY_EVAL
      save_dir: wandb
  callbacks:
    - class_path: callbacks.baseline_plot_callback.BaselinePlotCallback
      init_args:
        label_key: 'tea_category'
        output_dir: 'results/tsne_tea_category'
        label_sets:
          - ['-3']
          - ['-2']
          - ['-1']
          - ['0']
          - ['1']
          - ['2']
          - ['-3', '-2', '-1', '0', '1', '2']
  max_epochs: 1
  devices: 1
  accelerator: gpu
  check_val_every_n_epoch: 1
  enable_checkpointing: false
