# Runtime scalability baseline config: phate, emnist, N=60000
# Run: python main.py fit -c configs/runtime/baseline/phate_emnist_n60000.yaml

seed_everything: 42

data:
  class_path: data_model.M1datamodel_runtime_emnist.DMTBaseDataModule
  init_args:
    data_path: /zangzelin/data
    pca_dim: 64
    seed: 42
    sample_data_size: 60000
    batch_size: 60000
    num_workers: 0
    K: 200
    n_hop: 1

model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: "_phate"
    data_name: "runtime_phate_emnist_n60000"
    num_input_dim: 784
    n_components: 2
    p1: 2
    p2: 2
    p3: 0
    random_state: 42

trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: runtime_phate_emnist_n60000
      project: DiffTree_runtime
      save_dir: wandb
  callbacks:
    - class_path: callbacks.runtime_profiler.RuntimeProfilerCallback
      init_args:
        output_path: results/runtime/runtime_runs.csv
    - class_path: callbacks.Eval_density.FidelityEvalCallback
      init_args:
        every_n_epochs: 1
        down_sample: 3000
        knn_k: 12
        density_k: 15
