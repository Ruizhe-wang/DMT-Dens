# densMAP density-strength (dens_lambda) SEARCH sweep for the Table-1 main comparison.
#
# WHY: the Table-1 baselines were tuned only over the STRUCTURAL grid (p1=n_neighbors,
# p2=min_dist). densMAP's density-preservation strength `dens_lambda` was never searched
# -- it ran at the umap default (2.0). This sweep closes that gap so densMAP is tuned on
# the same density axis TopoBranch competes on. Structure (p1/p2) is FIXED at each
# dataset's already-tuned best (baked into the reused base configs); only dens_lambda varies.
#
#   config      = per-dataset base config (tuned p1/p2 baked in; reused read-only)
#   dens_lambda = density-preservation strength [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
#                 (umap densMAP default = 2.0, so the current Table-1 point is IN the grid;
#                  the search can only match or improve the reported number.)
#
# Grid: 9 datasets x 6 dens_lambda = 54 runs (1 CPU epoch, seed 42 each).
# After the sweep: export from wandb -> select_best_denslambda.py -> apply_best_denslambda.py.
#
# Requires the model/baseline_tri.py change (already on main) that forwards dens_lambda
# into umap.UMAP(densmap=True). Before it, this axis is a silent no-op.
program: main.py
method: grid
project: DiffTree_rz
name: baseline_densmap_denslambda_search

parameters:
  config:
    values:
      - configs/baseline_with_best_hyperparameter/densmap/tree.yaml
      - configs/baseline_with_best_hyperparameter/densmap/hcl.yaml
      - configs/baseline_with_best_hyperparameter/densmap/gast10k.yaml
      - configs/baseline_with_best_hyperparameter/densmap/epi.yaml
      - configs/baseline_with_best_hyperparameter/densmap/mca.yaml
      - configs/baseline_with_best_hyperparameter/densmap/mnist.yaml
      - configs/baseline_with_best_hyperparameter/densmap/emnist.yaml
      - configs/baseline_with_best_hyperparameter/densmap/ng20.yaml
      - configs/baseline_with_best_hyperparameter/densmap/act.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.dens_lambda:
    values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
