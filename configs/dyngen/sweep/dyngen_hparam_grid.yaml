# Focused grid for dynGen fate trajectory tuning — refined from sweep ezvo0t43
# (the earlier 80-run grid). Findings that shaped these ranges:
#   * tau is a DEAD knob: tau=1.0 and 2.5 gave bit-identical metrics -> dropped.
#   * lr=0.005 beat 0.002 (dist_corr 0.78 vs 0.71) -> held at base 0.005, not swept.
#   * nu_lat lower is better (0.005 > 0.01) -> scan small values only.
#   * density_k 8 ~= 12 -> keep both, drop 20.
#   * density_weight: dist_corr is U-shaped and MISLEADING — 0.025 gave the top
#     dist_corr (0.835) but svc only 0.696 (over-compressed). The balanced sweet
#     spot (high dist_corr AND high svc 0.88) was density_weight~0.008, so the
#     scan centers there and drops the compressing high end (>=0.025).
#   * K (data kNN) was not in ezvo0t43 -> new axis to explore (base 50).
#
# Grid = K(3) x density_weight(5) x density_k(2) x nu_lat(3) = 90 runs, single
# seed, 500 epochs. RANK BY gt/topology_f1 + svc TOGETHER (not dist_corr alone,
# which rewards the compressed degenerate), plus the per-run true-tree figure.
# Re-run the winner at 1000 epochs.
#
# Launch (per workflow_wandb_sweep): point YAML_DIR in
# scripts/run_wandb_multidata.sh at configs/dyngen/sweep and run it.

program: main.py
method: grid
project: DiffTree_rz
name: dyngen_focus4_grid_seed42_500ep_90

parameters:
  config:
    values:
      - configs/case_study/diftree/dyngen_fate.yaml
  seed_everything:
    values: [42]
  data.init_args.K:
    values: [50, 100, 200]
  model.init_args.density_weight:
    values: [0.003, 0.005, 0.008, 0.012, 0.018]
  model.init_args.density_k:
    values: [8, 12]
  model.init_args.nu_lat:
    values: [0.001, 0.003, 0.005]
  model.init_args.max_epochs:
    values: [500]
  trainer.max_epochs:
    values: [500]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
