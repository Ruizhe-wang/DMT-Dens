program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_anchor_subset_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]
  model.lg_warmup_epochs:
    value: 20

  # Number of anchors: controls how many local neighborhoods are sampled
  # - Fewer anchors: faster but less coverage
  # - More anchors: better coverage but heavier computation
  model.lg_num_anchors:
    values: [2, 4, 8, 16]

  # Subset size per anchor: controls local neighborhood radius
  # - Smaller: very local structure preservation
  # - Larger: broader context per anchor, closer to global
  model.lg_subset_k:
    values: [16, 32, 64, 128]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
