      num_layers: 2
      num_heads: 4
      ffn_ratio: 4.0
      dropout: 0.0
      attn_dropout: 0.0
      latent_rank: 16
      pooling: mean
      final_norm: true
      input_norm: batchnorm
      force_mem_efficient: true
    manifold_affinity: rank
    manifold_symmetric: bidirectional
    manifold_hardpair: true
    hardpair_k: 100
    density_scale_mode: multi
