# [5seed] C. elegans case study -- TopoBranch + 6 baselines, each at its BEST
# config x 5 seeds (seed_everything 41..45) = 7 x 5 = 35 runs. Produces the
# mean +/- std error bars for the developmental-time trajectory metrics
# (gt/pseudotime_corr, gt/time_ordering_acc, gt/time_continuity, gt/demap)
# logged by callbacks.celegan_gt_metrics_callback.
#
# TopoBranch runs on GPU (1000 epochs); baselines run on CPU (1 epoch,
# non-parametric). A single seed axis works for every method: TopoBranch is
# seeded directly by seed_everything; each baseline sets random_state: null, so
# its backend (sklearn/umap/pacmap/phate) follows the global NumPy RNG that
# Lightning's seed_everything seeds. Hyperparameters and run names are baked into
# each base config, so this sweep varies ONLY the seed.
#
# Launch: create the sweep from this file directly (the base configs live in the
# same folder, so do NOT point a *.yaml-glob launcher at the whole folder):
#   wandb sweep configs/case_study/celegan/5seed_rep/sweep_5seed_celegan.yaml
# then start agents for the printed sweep id (GPU host required for TopoBranch).

program: main.py
method: grid
project: DiffTree_rz
name: cs_5seed_all_methods_celegan

parameters:
  config:
    values:
      - configs/case_study/celegan/5seed_rep/celegan_topobranch_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_tsne_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_umap_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_densne_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_densmap_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_pacmap_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_phate_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_densmap_denslambda_celegan_5seed.yaml
      - configs/case_study/celegan/5seed_rep/baseline_densne_denslambda_celegan_5seed.yaml

  seed_everything:
    values: [41, 42, 43, 44, 45]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
