# Stage D: HCL (3038-d) comparison of the encoders at seed 42.
#
# Run this only on code at or after 3f03455, which restored the row-normalized Q
# in the manifold loss. Runs made between f9644c7 and that commit sit on a
# broken baseline and are not comparable with these.
#
# The learning rate is injected here for two reasons: the generated hcl_*.yaml
# files carry the SET_FROM_NG20_LR_SEARCH sentinel and cannot launch without it,
# and every architecture gets the identical three candidates, which is what
# fairness rule 1 asks for. The baseline MLP takes part in the same search
# rather than keeping its pre-tuned 5e-3.
#
# ng20_ft_transformer's HCL counterpart is deliberately absent. Feature
# tokenization puts one token per input dimension, so HCL needs 3039 tokens;
# measured with scripts/smoke_encoder.py that is roughly 51 GB of activations at
# the baseline batch, against 11 GB per card. It OOMs before the first step, and
# the protocol does not require standard feature attention on the
# high-dimensional datasets. Append configs/encoder_bench/hcl_ft_transformer.yaml
# below only if a batch small enough to fit is also chosen for every other
# encoder, otherwise the comparison stops being like-for-like.
#
# latent_transformer is the protocol model (low-rank r=4);
# latent_transformer_full is the capacity control (full D -> M*d_token map, the
# only variant landing inside the 0.5-2x parameter band on this dataset at
# 1.22x). Report them apart.
program: main.py
method: grid
project: TopoBranch_encoder_bench_HCL
name: encoder_bench_hcl_lr_seed42_fixed_baseline

parameters:
  config:
    values:
      - configs/encoder_bench/hcl_mlp.yaml
      - configs/encoder_bench/hcl_resmlp.yaml
      - configs/encoder_bench/hcl_latent_transformer.yaml
      - configs/encoder_bench/hcl_latent_transformer_full.yaml
  model.init_args.lr:
    values:
      - 0.005
      - 0.001
      - 0.0003

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
