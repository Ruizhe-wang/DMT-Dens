# =============================================================================
# DiffTree Consistency Evaluation (Micro-Training)
# =============================================================================
#
# Methodology:
#   - Global: DiffTree trained on ALL data -> embeddings
#   - Local: Fresh DiffTree (same config, random init) trained on SUBSET -> embeddings
#   - Compare: Are local structures preserved consistently?
#
# Run: python main.py fit -c conf/consistency_eval/difftree_consistency.yaml
# =============================================================================

seed_everything: 42

data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    pca_dim: 64
    batch_size: 5000
    num_workers: 0
    K: 200
    n_hop: 1
    data_path: data

model:
  class_path: model.DiffTreeVQ_v2.DMTEVT_model
  init_args:
    num_input_dim: 784
    T_hidden_size: 512
    T_num_layers: 3
    t_output_dim: 40
    tree_depth: 10
    num_use_moe: 1
    lr: 0.005
    weight_decay: 0.0000000001
    nu_lat: 0.01
    nu_emb: -1
    exaggeration_lat: 2
    exaggeration_emb: -1
    loss_type: 'G'
    all_g_l_weight: 0.95
    ec_ce_weight: 2
    exp_b: 0.4
    exp_min: 1e-6
    max_epochs: 100
    step2_epoch: 1000
    step2_r_epoch: 1000
    sample_rate_feature: 1.00
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    num_use_mlevel_list: [0.5, 1, 5, 10]

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: difftree_consistency_m3_all
      project: CONSISTENCY_EVAL
      save_dir: wandb

  callbacks:
    # ==========================================================================
    # Checkpoint saving
    # ==========================================================================
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: '/usr/storage/ruizhe/mldr/results'
        filename: 'difftree-{epoch:03d}'
        save_last: true
        every_n_epochs: 100

    # ==========================================================================
    # Consistency Analysis (runs at end of training)
    # ==========================================================================
    - class_path: callbacks.consistency_callback.ConsistencyCallback
      init_args:
        # --- Core Settings ---
        label_key: 'cell_type'

        # --- Label Sets to Analyze ---
        label_sets:
          - [1, 7]
          - [4, 9]
          - [4, 6, 9]

        # --- Layer Selection ---
        layers: [0, 1, 2, 3]

        # --- Micro-Training Config ---
        micro_training_epochs: 500
        # Strategy: 'fixed_epochs' | 'proportional' | 'converge'
        #   fixed_epochs:   所有子集相同 epoch 数（原始行为）
        #   proportional:   epoch = global_epochs × (subset_size / full_size)
        #                   保留 cosine LR，epoch 按数据量比例缩放
        #   converge:       常数 LR，micro_training_epochs 为上限
        micro_training_strategy: 'proportional'
        save_micro_ckpt: 'results/micro_ckpts'

        # --- Baseline Local Method (for t-SNE/UMAP models) ---
        local_method: 'umap'

    # --- Standard Visualization ---
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: 'results/difftree_consistency'

  max_epochs: 500
  devices: 1
  accelerator: gpu
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
