# Branch3D sweep: DiffTree + every baseline on the diverse-density 3D branching
# dataset, in ONE grid. Each run trains one method and emits a clean,
# no-background 2D embedding (via PaperEmbeddingCallback in each base config)
# under outputs/paper_embeddings/branch3d/<method>/ for the paper.
#
# Launch: set YAML_DIR="configs/branch3d/sweep" in scripts/run_wandb_multidata.sh
#         then  bash scripts/run_wandb_multidata.sh
# (or, single method:  python main.py fit -c configs/branch3d/<method>.yaml)
#
# 7 configs x 1 = 7 runs. DiffTree needs a GPU; baselines run on CPU (1 epoch).

program: main.py
method: grid
project: DiffTree_rz
name: branch3d_all_methods

parameters:
  config:
    values:
      - configs/branch3d/difftree.yaml
      - configs/branch3d/tsne.yaml
      - configs/branch3d/umap.yaml
      - configs/branch3d/densmap.yaml
      - configs/branch3d/densne.yaml
      - configs/branch3d/phate.yaml
      - configs/branch3d/pacmap.yaml
  seed_everything:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
