# dynGen fate baseline DENSITY-STRENGTH sweep -- the dens_lambda axis that the
# structural sweep (sweep_baselines_hparam_dyngen.yaml) does not cover. Fair
# analog of the DiffTree density_weight sweep, for the density-preserving
# baselines (densNE / densMAP). Mirrors
# configs/appendix_sweeps/sweep_baselines_denslambda_celegan.yaml.
#
#   p1          = structural index [0..5]
#                   densNE -> perplexity   densMAP -> n_neighbors
#   dens_lambda = density-preservation strength [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
#
# Grid: 2 methods x 6 (p1) x 6 (dens_lambda) = 72 runs (1 CPU epoch each).
# Rank by gt/topology_f1 + gt/demap (logged by DyngenGroundTruthMetricsCallback).
#
# Launch (per workflow_wandb_sweep): set
#   YAML_DIR="configs/dyngen/baseline/sweep"
# in scripts/run_wandb_multidata.sh, then run it. That folder is a set of sweep
# drivers; the script's *.yaml glob launches each (structural + this one). To run
# only this sweep, point YAML_DIR at a folder holding just this file.

program: main.py
method: grid
project: DiffTree_rz
name: dyngen_hpsweep_baselines_denslambda

parameters:
  config:
    values:
      - configs/dyngen/baseline/baseline_densne_denslambda_dyngen.yaml
      - configs/dyngen/baseline/baseline_densmap_denslambda_dyngen.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4, 5]

  model.init_args.dens_lambda:
    values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
