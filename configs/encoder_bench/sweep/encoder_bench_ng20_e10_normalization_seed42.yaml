# E10: the normalization hypothesis, NG20 seed 42.
# 5 arms x 2 learning rates = 10 runs. Each run config has its own
# checkpoint, plot, runtime-CSV and runtime-info paths so concurrent
# agents cannot share artifact directories (the E01 failure mode).
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e10_normalization_seed42
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e10/runs/ng20_resmlp_bn_lr0p005.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_resmlp_bn_lr0p001.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_resmlp_lrelu_lr0p005.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_resmlp_lrelu_lr0p001.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_lr0p005.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_lr0p001.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_bn_lr0p005.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_bn_lr0p001.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_bn_input_lr0p005.yaml
      - configs/encoder_bench/sweep_e10/runs/ng20_latent_m32_r16_nodrop_bn_input_lr0p001.yaml
