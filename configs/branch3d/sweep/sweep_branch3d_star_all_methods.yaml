# Branch3D 'star' sweep: DiffTree + all baselines on the star lineage dataset.
# Each run emits a clean no-background 2D embedding under
# outputs/paper_embeddings/branch3d_star/<method>/ for the paper.
# Launch: set YAML_DIR="configs/branch3d/sweep" in scripts/run_wandb_multidata.sh
#         (or run only this file's methods one by one with: python main.py fit -c <cfg>)
program: main.py
method: grid
project: DiffTree_rz
name: branch3d_star_all_methods

parameters:
  config:
    values:
      - configs/branch3d/star/difftree.yaml
      - configs/branch3d/star/tsne.yaml
      - configs/branch3d/star/umap.yaml
      - configs/branch3d/star/densmap.yaml
      - configs/branch3d/star/densne.yaml
      - configs/branch3d/star/phate.yaml
      - configs/branch3d/star/pacmap.yaml
  seed_everything:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
