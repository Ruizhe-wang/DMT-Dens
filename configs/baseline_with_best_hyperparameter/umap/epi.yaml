# Best observed baseline configuration from W&B hp_sweep (2026-06-30 export).
# Selection metric: W&B `val_score` column (higher is better).
# Source run: baseline_umap_epi; best observed val_score=0.403897.
# Grid indices p1=0, p2=4 decode to: n_neighbors=10, min_dist=0.15
seed_everything: 42
data:
  class_path: data_model.M1datamodel_epi.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data
    pca_dim: 64
    batch_size: 100000
    num_workers: 0
    K: 200
    n_hop: 1
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _umap
    data_name: epi
    num_input_dim: 500
    n_components: 2
    p1: 0
    p2: 4
    p3: 0
    random_state: 42
    n_neighbors: 10
    min_dist: 0.15
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: baseline_best_umap_epi
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/plots/baseline_with_best_hyperparameter/umap/epi
      every_n_epochs: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
