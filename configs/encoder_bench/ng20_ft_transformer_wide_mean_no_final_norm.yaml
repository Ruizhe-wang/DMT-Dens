# Generated by configs/encoder_bench/generate_configs.py.
# Dataset: ng20; encoder configuration: ft_transformer_wide_mean_no_final_norm; seed: 42.
# Projection head, augmentation, sampling, losses and fidelity callback
# are inherited unchanged from the current dataset baseline.
# lr=0.005 is the dataset mainline value and is identical for every encoder. The formal NG20 runs go through sweep/encoder_bench_ng20_lr_seed42.yaml, which searches 0.005, 0.001, 0.0003 for every architecture including the baseline.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_20ng.DMTBaseDataModule
  init_args:
    data_path: /zangzelin/data
    pca_dim: 64
    batch_size: 4096
    num_workers: 8
    K: 200
    n_hop: 1
model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 100
    num_train_data: 18846
    lr: 0.005
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.01
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 1000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-06
    t_mul: 1.0
    num_use_mlevel_list:
    - 1
    density_weight: 0.0018
    density_k: 12
    density_num_anchors: 512
    encoder_type: ft_transformer
    encoder_kwargs:
      d_token: 96
      num_layers: 2
      num_heads: 4
      ffn_ratio: 4.0
      dropout: 0.1
      attn_dropout: 0.1
      pooling: mean
      final_norm: false
      force_mem_efficient: true
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 500
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: ft-transformer-wide-mean-no-final-norm_ng20_seed42
      project: TopoBranch_encoder_bench_NG20
      save_dir: wandb/encoder_bench
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: outputs/encoder_bench/checkpoints/ng20_ft_transformer_wide_mean_no_final_norm
      filename: ng20_ft_transformer_wide_mean_no_final_norm-{epoch:04d}
      save_last: true
      every_n_epochs: 100
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/encoder_bench/plots/ng20_ft_transformer_wide_mean_no_final_norm
      every_n_epochs: 50
      save_embeddings: true
      embedding_method_name: ft-transformer-wide-mean-no-final-norm
  - class_path: callbacks.xc_plot_heterogeneity.HeterogeneityPlotCallback
    init_args:
      output_dir: outputs/encoder_bench/plots/ng20_ft_transformer_wide_mean_no_final_norm/heterogeneity
      every_n_epochs: 50
      target_label: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 50
      down_sample: 3000
      knn_k: 12
      density_k: 15
  - class_path: callbacks.runtime_profiler.RuntimeProfilerCallback
    init_args:
      output_path: results/encoder_bench/runtime_runs.csv
  - class_path: callbacks.encoder_benchmark.EncoderBenchmarkCallback
    init_args:
      tail_epochs: 20
      cv_threshold: 0.25
      direction_change_threshold: 0.5
      spike_ratio_threshold: 3.0
      check_grad_every_n_steps: 50
  - class_path: callbacks.xc_paper_embedding_callback.PaperEmbeddingCallback
    init_args:
      output_dir: outputs/encoder_bench/plots/ng20_ft_transformer_wide_mean_no_final_norm/paper
      method_name: ft-transformer-wide-mean-no-final-norm
      color_key: final_annotation
      every_n_epochs: null
      point_size: 6.0
      alpha: 0.85
      cmap: tab20
      overflow_cmap: gist_ncar
      figsize: 4.0
      dpi: 300
      formats:
      - png
  - class_path: callbacks.runtime_info_callback.RuntimeInfoCallback
    init_args:
      output_dir: outputs/encoder_bench/runtime_info
