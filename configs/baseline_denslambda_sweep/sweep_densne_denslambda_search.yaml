# den-SNE density-strength (dens_lambda) SEARCH sweep for the Table-1 main comparison.
#
# WHY: the Table-1 baselines were tuned only over the STRUCTURAL grid (p1=perplexity,
# p2=early_exaggeration). den-SNE's density-preservation strength `dens_lambda` was never
# searched -- it ran at the native den-SNE default (0.1). This sweep closes that gap so
# den-SNE is tuned on the same density axis TopoBranch competes on. Structure (p1/p2) is
# FIXED at each dataset's already-tuned best (baked into the reused base configs); only
# dens_lambda varies. dens_frac is left at its default (0.3) per the agreed scope.
#
#   config      = per-dataset base config (tuned p1/p2 baked in; reused read-only)
#   dens_lambda = density-preservation strength [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
#                 (native den-SNE default = 0.1, so the current Table-1 point is IN the grid;
#                  the search can only match or improve the reported number.)
#
# EMNIST is intentionally absent: den-SNE is OOT on the 698K-point EMNIST (24 h budget) and
# stays marked OOT in Table 1 -- there is no tuned base config for it.
#
# Grid: 8 datasets x 6 dens_lambda = 48 runs (1 CPU epoch, seed 42 each).
# After the sweep: export from wandb -> select_best_denslambda.py -> apply_best_denslambda.py.
#
# Requires the model/baseline_tri.py change (already on main) that forwards dens_lambda into
# the native den-SNE backend (_run_native_densne_module). Before it, this axis is a no-op.
program: main.py
method: grid
project: DiffTree_rz
name: baseline_densne_denslambda_search

parameters:
  config:
    values:
      - configs/baseline_with_best_hyperparameter/densne/tree.yaml
      - configs/baseline_with_best_hyperparameter/densne/hcl.yaml
      - configs/baseline_with_best_hyperparameter/densne/gast10k.yaml
      - configs/baseline_with_best_hyperparameter/densne/epi.yaml
      - configs/baseline_with_best_hyperparameter/densne/mca.yaml
      - configs/baseline_with_best_hyperparameter/densne/mnist.yaml
      - configs/baseline_with_best_hyperparameter/densne/ng20.yaml
      - configs/baseline_with_best_hyperparameter/densne/act.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.dens_lambda:
    values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
