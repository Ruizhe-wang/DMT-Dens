# LG warmup × large batch size sweep for DiffTree v3 on MNIST (labels [1,7])
# 在更大 batch size 区间探究 warmup 的必要性和最优时长
# - 已有实验覆盖 1500~8192，本实验向上扩展至 16000
# - 大 batch 下梯度方差低，manifold loss 收敛更快，但 LG loss 更易锁定退化模式
program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_warmup_large_batch_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]

  model.lg_warmup_epochs:
    values: [0, 10, 20, 50, 100]

  data.batch_size:
    values: [8192, 10000, 12000, 14000, 16000]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
