# Case study config for CellRank Pancreatic endocrinogenesis.
# Run on c90_vm:
#   source /opt/miniforge3/etc/profile.d/conda.sh
#   conda activate mldr
#   python main.py fit -c configs/case_study/pancreatic_endocrinogenesis.yaml

seed_everything: 42

data:
  class_path: data_model.M1datamodel_pancreas.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data/pancreas
    h5ad_file: endocrinogenesis_day15.5_preprocessed.h5ad
    label_key: clusters
    pseudotime_key: dpt_pseudotime
    top_genes: 2000
    pca_dim: 64
    seed: 42
    sample_data_size: 2531
    batch_size: 2531
    num_workers: 4
    K: 100
    n_hop: 1
    minmax_scale: true

model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 2000
    num_train_data: 2531
    lr: 0.005
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.01
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 1000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: false
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-6
    t_mul: 1.0
    num_use_mlevel_list: [1]
    density_weight: 0.001
    density_k: 12
    density_num_anchors: 256

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: false
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: case_study_pancreatic_endocrinogenesis
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: outputs/plots/case_study_pancreatic_endocrinogenesis
        every_n_epochs: 50
        save_embeddings: false
        embedding_method_name: topobranch
    - class_path: callbacks.pancreas_paper_plot_callback.PancreasPaperPlotCallback
      init_args:
        output_dir: outputs/paper_figures/pancreas/difftree
        every_n_epochs: 1000
        method_name: DiffTree
        layer: -1
        save_formats: [png, pdf, svg]
        save_table: true
        log_to_wandb: true
    - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
      init_args:
        dataset_name: pancreas
        output_dir: outputs/embeddings
        save_format: both
        embedding_method_name: topobranch
    - class_path: callbacks.Eval_density.FidelityEvalCallback
      init_args:
        every_n_epochs: 50
        down_sample: 3000
        knn_k: 12
        density_k: 15
