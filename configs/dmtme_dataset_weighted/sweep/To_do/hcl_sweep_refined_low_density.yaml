program: main.py
method: grid
project: DiffTree_rz
name: HCL_density_low_weight_refined_v2
parameters:
  config:
    values:
      - 'configs/dmtme_dataset_weighted/HCL.yaml'

  # Refined after visual inspection:
  # weights above 0.003 tend to form a continuous manifold in the center,
  # while 0.001 and 0.003 keep clearer central clusters.
  model.init_args.density_weight:
    values: [0.0008, 0.001, 0.0012, 0.0015, 0.0018, 0.002, 0.0023, 0.0026, 0.003]

  # Keep the local density scale focused around the previous useful range.
  # Smaller k emphasizes sharper local clusters; larger k checks whether the
  # cluster-to-manifold transition is caused by density scale rather than weight.
  model.init_args.density_k:
    values: [8, 10, 12, 14, 16]

  # Fixed-weight analysis showed 384/512 dominate the low-weight region.
  model.init_args.density_num_anchors:
    values: [384, 512]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
