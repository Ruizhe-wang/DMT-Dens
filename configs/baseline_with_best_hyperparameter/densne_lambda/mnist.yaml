# Best-hyperparameter config WITH tuned density strength (dens_lambda).
# base: configs/baseline_with_best_hyperparameter/densne/mnist.yaml (tuned p1/p2)
# dens_lambda=1 selected from the dens_lambda search by the balanced rule
#   score = 0.5*norm(density_correlation) + 0.5*norm(svc_acc); ties -> higher density.
# Selected: density_corr=0.773, svc=0.928 (from 6 lambda values).
seed_everything: 42
data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    data_path: data
    pca_dim: 64
    batch_size: 60000
    num_workers: 0
    K: 100
    n_hop: 1
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _densne
    data_name: mnist
    num_input_dim: 784
    n_components: 2
    p1: 4
    p2: 4
    p3: 0
    random_state: null
    perplexity: 120
    early_exaggeration: 24
    dens_lambda: 1.0
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/logs
      name: baseline_best_densne_lambda_mnist
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/plots/baseline_with_best_hyperparameter/densne_lambda/mnist
      every_n_epochs: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
