# E15: post-norm on both encoder branches, plus the M*rank bottleneck,
# on HCL (D=3038) at seed 42. Controls are the E13 HCL runs on the same
# machine and protocol: mlp 0.8758, resmlp-bn 0.8616, latent-bn 0.8532.
# The bar is the MLP, not the previous Transformer best.
program: main.py
method: grid
project: TopoBranch_encoder_bench_HCL
name: encoder_bench_e15_postnorm_hcl_seed42
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_postnorm_ln_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_postnorm_ln_lr0p0003_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_postnorm_bn_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_postnorm_bn_lr0p0003_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_rank32_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_latent_rank32_lr0p0003_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_resmlp_postnorm_bn_lr0p001_seed42.yaml
      - configs/encoder_bench/sweep_e15/runs/hcl_resmlp_postnorm_bn_lr0p0003_seed42.yaml
