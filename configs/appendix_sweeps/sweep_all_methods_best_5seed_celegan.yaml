# [5seed] Celegan case-study final comparison -- ALL 9 methods in ONE sweep.
#
# DiffTree + 8 baselines, each at its BEST config, x 5 seeds (seed_everything
# 41..45) = 45 runs. Single seed axis works for every method:
#   * DiffTree is seeded directly by seed_everything.
#   * Baselines have random_state: null in their baked base configs, so their
#     backends (sklearn/umap/pacmap/phate) fall back to the global NumPy RNG that
#     Lightning's seed_everything seeds -> varying seed_everything varies them too.
#
# Each method's hyperparameters and run name are baked into its *_best5seed base
# config (in configs/case_study_hyperparameter_sweep/), so this sweep only varies
# the seed -- no per-method params here (which would otherwise break methods that
# don't accept them, e.g. density_weight on a baseline).
#
# Best configs (baked):
#   DiffTree density_k=12, density_num_anchors=1000, density_weight=0.01
#   phate p1=3,p2=0   tsne p1=3,p2=0   umap p1=0,p2=0   pacmap p1=0,p2=5
#   densmap p1=5,p2=0   densne p1=3,p2=4
#   densmap_denslambda p1=5,dens_lambda=4.0   densne_denslambda p1=4,dens_lambda=4.0
#
# NOTE: DiffTree runs on GPU, baselines on CPU (1 epoch each); the launcher/agent
# host needs a GPU for the DiffTree config.

program: main.py
method: grid
project: DiffTree_rz
name: cs_5seed_all_methods_celegan

parameters:
  config:
    values:
      - configs/case_study_hyperparameter_sweep/difftree_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_phate_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_tsne_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_umap_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_pacmap_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densmap_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densne_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densmap_denslambda_celegan_best5seed.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densne_denslambda_celegan_best5seed.yaml

  seed_everything:
    values: [41, 42, 43, 44, 45]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
