# 5-seed run of ALL baseline best-hyperparameter configurations.
# Grid = (70 configs) x (5 seeds) = 350 runs.
#
# Each config already carries its best (p1,p2) decoded hyperparameters,
# selected by W&B val_score from the 2026-06-30 hp_sweep.
# seed_everything is swept here to override the per-file default (42).
#
# Coverage: 6 baselines x 9 datasets (act, epi, tree, emnist, gast10k, hcl,
#   mca, ng20, mnist) minus densne/emnist (OOT; no run available) = 53 configs,
#   PLUS 17 density-strength (dens_lambda) tuned variants of densMAP (9) and
#   den-SNE (8) under densmap_lambda/ and densne_lambda/.
#
# NOTE (seeds): baseline stochasticity comes from model.init_args.random_state.
#   baseline_tri resolves random_state=null from PL_GLOBAL_SEED, so seed_everything
#   injects a genuine seed ONLY when the config leaves random_state null (verified).
#   - The 17 densmap_lambda/ densne_lambda variants set random_state: null, so their
#     5 seeds below are REAL (non-zero error bars).
#   - The 53 legacy base configs still pin random_state: 42, so their 5 seeds give
#     IDENTICAL embeddings (zero-width error bars). To fix them too, set
#     random_state: null in those base configs (do NOT add a random_state sweep
#     axis here -- that would 5x the grid and decouple it from seed_everything).
#
# Run:
#   wandb sweep configs/baseline_with_best_hyperparameter/baseline_with_best_hyperparameter_5seed_sweep.yaml
#   wandb agent <entity>/DiffTree_rz/<sweep_id>

program: main.py
method: grid
project: DiffTree_rz
name: baseline_with_best_hyperparameter_5seed

parameters:
  config:
    values:
      - 'configs/baseline_with_best_hyperparameter/densmap/act.yaml'
      - 'configs/baseline_with_best_hyperparameter/densmap/emnist.yaml'
