# [5seed] den-SNE baseline on C. elegans -- logs developmental-time trajectory
# metrics (gt/*) to W&B via CeleganGroundTruthMetricsCallback. Best config p1=3,
# p2=4 (from the celegan baseline sweep). Non-parametric: 1 CPU epoch x 5 seeds (seed_everything 41-45, swept by
# sweep_5seed_celegan.yaml). random_state: null so the backend RNG follows
# seed_everything.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_celegan.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data
    pca_dim: 64
    batch_size: 54649
    num_workers: 0
    K: 50
    n_hop: 1
    include_time_label: true
    exclude_unannotated: true
    standardize: true
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _densne
    data_name: celegan
    num_input_dim: 2766
    n_components: 2
    p1: 3
    p2: 4
    p3: 0
    random_state: null
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: cs_5seed_densne_celegan
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
    init_args:
      dataset_name: celegan_5seed
      output_dir: outputs/embeddings
      save_format: both
      embedding_method_name: densne
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
  - class_path: callbacks.celegan_gt_metrics_callback.CeleganGroundTruthMetricsCallback
    init_args:
      every_n_epochs: 1
      pca_dim: 50
      time_key: embryo_time_numeric
      knn: 15
      demap_landmarks: 1000
      demap_knn: 15
      prefix: gt
  - class_path: callbacks.case_study_callback.VisualizationCallback
    init_args:
      output_dir: outputs/case_study/celegan_5seed/densne
      dataset_name: CELEGAN
      method_name: den-SNE
      every_n_epochs: 1
      max_plot_samples: 100000
      save_formats: [png, pdf]
      dpi: 800
      point_size: 4.5
      alpha: 0.9
      panel_prefix: case_study
      time_vmin: 50
      time_vmax: 750
      show_colorbar: true
      save_legend: true
