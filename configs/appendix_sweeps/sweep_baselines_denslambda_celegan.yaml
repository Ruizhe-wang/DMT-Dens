# [2/3] Celegan baseline DENSITY-STRENGTH sweep -- the dens_lambda axis that was
# missing from the structural sweep. Fair analog of the DiffTree density_weight
# sweep, for the density-preserving baselines (densNE / densMAP).
#
#   p1          = structural index [0..5]
#                   densNE -> perplexity   densMAP -> n_neighbors
#   dens_lambda = density-preservation strength [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]
#
# Grid: 2 methods x 6 (p1) x 6 (dens_lambda) = 72 runs (1 CPU epoch each).
#
# Requires the model/baseline_tri.py change (already on main) that exposes
# dens_lambda/dens_frac and forwards dens_lambda into umap.UMAP for densMAP.
# Base configs live in configs/case_study_hyperparameter_sweep/.

program: main.py
method: grid
project: DiffTree_rz
name: cs_hpsweep_baselines_denslambda_celegan

parameters:
  config:
    values:
      - configs/case_study_hyperparameter_sweep/baseline_densne_denslambda_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densmap_denslambda_celegan.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4, 5]

  model.init_args.dens_lambda:
    values: [0.1, 0.25, 0.5, 1.0, 2.0, 4.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
