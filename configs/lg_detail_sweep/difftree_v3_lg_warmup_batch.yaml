# LG warmup × batch size sweep for DiffTree v3 on MNIST (labels [1,7])
# 验证 3.18 report 的核心发现：warmup 在大 batch 下是否为必要条件
# - 小 batch 下 warmup 可能不必要（梯度噪声本身就是正则化）
# - 大 batch 下无 warmup 易导致表示坍缩（3.18 已观测到）
program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_warmup_batch_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]

  # Warmup 时长：关键变量
  model.lg_warmup_epochs:
    values: [0, 10, 20, 50]

  # Batch size：从小到大覆盖临界区间
  # 3.18 report 显示 batch_size >= 3000 时无 warmup 开始出现坍缩
  data.batch_size:
    values: [1500, 3000, 4500, 6500, 8192]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
