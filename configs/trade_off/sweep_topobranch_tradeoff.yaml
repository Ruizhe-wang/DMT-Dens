# =============================================================================
# TRADE-OFF sweep -- TopoBranch
# =============================================================================
# Purpose: trace TopoBranch's density-preservation vs label-separability
# trade-off CURVE by sweeping its density-strength knob `density_weight`
# (lambda_d), with genuine seed repeats. Paired with sweep_baselines_tradeoff.yaml
# to plot three Pareto curves (x = SVC acc, y = density correlation). If
# TopoBranch's curve dominates den-SNE's and densMAP's over the overlapping SVC
# range, "we preserve more density at equal separability" is a frontier claim,
# not a single cherry-picked lambda_d (directly answers the "you tuned the knob
# that defines the metric" critique).
#
# FAIRNESS: symmetric with the baselines sweep -- structural / architectural HPs
#   are FIXED at each dataset's tuned best (baked into the reused
#   baseline_with_new_metrics/difftree base configs); only the DENSITY knob
#   `density_weight` varies.
#
# DENSITY grid: spans from 0.0 (no-density anchor -> high SVC / low density corr)
#   through the paper default 0.0018 up to 0.05 (high density corr / low SVC), so
#   the full curve overlaps the baselines' SVC range for matched-x comparison.
#   (cf. Table S6: lambda_d 0.0001 -> 0.492, 0.0018 -> 0.878, 0.02 -> 0.936.)
#
# SEEDS: TopoBranch is torch-trained, so `seed_everything` is the effective seed
#   (matches the repo's difftree 5-seed pattern).
#
# Run count: 4 datasets x 12 density_weight x 5 seeds = 240 runs (each 1000 epochs,
#   GPU). This is the heavy job -- to cut cost, drop to 3 seeds (-> 144 runs)
#   and/or thin the density_weight grid, or run the four datasets as separate
#   agents.
# Launch:  wandb sweep configs/trade_off/sweep_topobranch_tradeoff.yaml
#          wandb agent <sweep_id>
# =============================================================================
program: main.py
method: grid
project: DiffTree_rz
name: tradeoff_topobranch_densityweight_5seed

parameters:
  config:
    values:
      - configs/baseline_with_new_metrics/difftree/hcl.yaml
      - configs/baseline_with_new_metrics/difftree/gast10k.yaml
      - configs/baseline_with_new_metrics/difftree/mca.yaml
      - configs/baseline_with_new_metrics/difftree/epi.yaml

  # DENSITY knob -- the trade-off axis. Widened: 0.0 = no-density anchor (high SVC
  # / low density corr) through the paper default 0.0018 up to 0.15 (strong density
  # / low SVC), log-spaced with extra points near the default to resolve the elbow.
  model.init_args.density_weight:
    values: [0.0, 0.0002, 0.0006, 0.0012, 0.0018, 0.003, 0.006, 0.01, 0.02, 0.04, 0.08, 0.15]

  # Secondary density settings pinned to the paper's canonical values
  model.init_args.density_k:
    value: 12
  model.init_args.density_num_anchors:
    value: 512

  # Seed repeats -- seed_everything is the effective seed for the torch-trained model
  seed_everything:
    values: [42, 43, 44, 45, 46]

  # Keep epoch budget consistent across the sweep
  model.init_args.max_epochs:
    value: 1000
  trainer.max_epochs:
    value: 1000

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
