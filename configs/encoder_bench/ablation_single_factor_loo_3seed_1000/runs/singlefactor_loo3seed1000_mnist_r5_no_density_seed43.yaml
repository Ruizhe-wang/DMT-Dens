# Generated by configs/encoder_bench/ablation_single_factor_loo_3seed_1000/generate_configs.py
# Strict leave-one-out: mnist, r5_no_density, seed 43, 1000 epochs.
# Scientific settings match v2; only the requested seed and run identity differ.
seed_everything: 43
data:
