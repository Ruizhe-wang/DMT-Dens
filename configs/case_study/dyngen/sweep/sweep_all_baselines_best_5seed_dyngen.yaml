# [5seed] dynGen fate case-study final comparison -- DiffTree + ALL baselines in ONE sweep.
#
# Each method at its BEST config x 5 seeds (seed_everything 41..45) = 7 x 5 = 35 runs.
# Best configs were chosen from the hyperparameter sweeps (results:
#  D:/ruizhe/result/case_study/dyngen/cs_hpsweep_dyngen_baseline.csv and
#  cs_hpsweep_dyngen_difftree.csv) by the documented ranking criterion
# gt/topology_f1 + gt/demap.
#
# NOTE: DiffTree runs on GPU (1000 epochs), baselines on CPU (1 epoch) -- the
# launcher/agent host needs a GPU for the DiffTree config.
#
# A single seed axis works for every method: each baseline's base config sets
# random_state: null, so its backend (sklearn/umap/pacmap/phate) falls back to the
# global NumPy RNG that Lightning's seed_everything seeds -> varying seed_everything
# varies the embedding too. Hyperparameters and run name are baked into each
# *_best5seed base config, so this sweep varies ONLY the seed (no per-method params,
# which would break methods that don't accept them).
#
# Best configs (baked):
#   difftree K=500, density_k=12, density_weight=0.018, nu_lat=0.005
#   phate   p1=3,p2=5  (knn=20, decay=160)
#   tsne    p1=4,p2=5  (perplexity=120, early_exaggeration=32)
#   umap    p1=2,p2=2  (n_neighbors=20, min_dist=0.05)
#   pacmap  p1=4,p2=0  (n_neighbors=80, MN/FP=0.3/1.0)
#   densmap p1=0,p2=4  (n_neighbors=10, min_dist=0.15)
#   densne  p1=5,p2=5  (perplexity=200, early_exaggeration=32)
#
# Launch (per workflow_wandb_sweep): set
#   YAML_DIR="configs/case_study/dyngen/sweep"
# in scripts/run_wandb_multidata.sh, then run it. (This folder holds ONLY this
# sweep file, so the script's *.yaml glob launches exactly one sweep; the baked
# base configs live one level up in configs/case_study/dyngen/.)

program: main.py
method: grid
project: DiffTree_rz
name: cs_5seed_baselines_dyngen

parameters:
  config:
    values:
      - configs/case_study/dyngen/difftree_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_phate_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_tsne_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_umap_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_pacmap_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_densmap_dyngen_best5seed.yaml
      - configs/case_study/dyngen/baseline_densne_dyngen_best5seed.yaml

  seed_everything:
    values: [41, 42, 43, 44, 45]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
