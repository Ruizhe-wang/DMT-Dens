# [5seed-baked] DiffTree/TopoBranch on dynGen fate at BEST config
# (K=500, density_k=12, density_weight=0.018, nu_lat=0.005; density_num_anchors=256
#  kept from the sweep base -- it was never swept). Selected from the DiffTree
# sweep (results: D:/ruizhe/result/case_study/dyngen/cs_hpsweep_dyngen_difftree.csv)
# by gt/topology_f1 + gt/demap: topoF1=0.962, demap=0.852, densCorr=0.791 --
# Pareto-dominates every baseline (matches top topology while keeping density).
# Used by sweep/sweep_all_baselines_best_5seed_dyngen.yaml; only seed_everything
# is swept (DiffTree is seeded directly by seed_everything; GPU run).

seed_everything: 42

data:
  class_path: data_model.M1datamodel_dyngen_fate.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/zelin181data/sclineage/single-cell-lineage1/data/figure3_fate/dyngen
    h5ad_file: fig3_fate_dyngen_shared_dynGenZL10k_hyperbranch_v2_seed42.h5ad
    label_key: fig3_true_terminal
    state_key: fig3_true_state
    time_key: fig3_true_time
    branch_key: true_branch
    top_genes: null
    pca_dim: 64
    seed: 42
    sample_data_size: 10000
    batch_size: 1000
    num_workers: 4
    K: 500
    n_hop: 1
    minmax_scale: true

model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 3328
    num_train_data: 10000
    lr: 0.005
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.005
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 1000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: false
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-6
    t_mul: 1.0
    num_use_mlevel_list: [1]
    density_weight: 0.018
    density_k: 12
    density_num_anchors: 256

trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: false
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: cs_5seed_difftree_dyngen
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: outputs/plots/case_study_dyngen_fate
        every_n_epochs: 50
        save_embeddings: false
        embedding_method_name: topobranch
    - class_path: callbacks.case_study_callback.VisualizationCallback
      init_args:
        output_dir: outputs/case_study/dyngen/difftree
        dataset_name: dynGen fate
        method_name: TopoBranch
        every_n_epochs: 50
        max_plot_samples: 10000
        save_formats: [png, pdf]
        dpi: 800
        point_size: 5.0
        alpha: 0.9
        panel_prefix: case_study_dyngen_fate
        time_vmin: 0.0
        time_vmax: 1.0
        show_colorbar: true
        save_legend: true
    - class_path: callbacks.case_study_fateprob_callback.FateProbabilityVisualizationCallback
      init_args:
        output_dir: outputs/case_study/dyngen/difftree
        dataset_name: dynGen fate
        method_name: TopoBranch
        every_n_epochs: 50
        max_plot_samples: 10000
        save_formats: [png, pdf]
        dpi: 800
        point_size: 5.0
        alpha: 0.9
        panel_prefix: case_study_dyngen_fate
        show_colorbar: true
        save_legend: true
        fate_cmap: magma
        fate_vmin: 0.0
        fate_vmax: 1.0
        plot_fate_argmax: true
        fate_commit_threshold: 0.5            # cells below this top-prob -> grey "uncommitted"
    # Ground-truth tree backbone overlaid on the embedding (topology-preservation proof).
    - class_path: callbacks.case_study_truetree_callback.TrueTreeOverlayVisualizationCallback
      init_args:
        output_dir: outputs/case_study/dyngen/difftree
        dataset_name: dynGen fate
        method_name: TopoBranch
        every_n_epochs: 50
        max_plot_samples: 10000
        save_formats: [png, pdf]
        dpi: 800
        point_size: 4.0
        alpha: 0.7
        panel_prefix: case_study_dyngen_fate
        background_color_by: pseudotime       # obs key added by the loader (from time_key)
        background_cmap: viridis
        min_cells_per_node: 10                # nodes below this are skipped (e.g. sP=5 cells)
        node_size: 70.0
        edge_width: 1.8
        show_labels: true
        label_terminals_only: false
        from_key: from
        to_key: to
        branch_key: branch
    - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
      init_args:
        dataset_name: dyngen_fate
        output_dir: outputs/embeddings
        save_format: both
        embedding_method_name: topobranch
    - class_path: callbacks.Eval_density.FidelityEvalCallback
      init_args:
        every_n_epochs: 50
        down_sample: 3000
        knn_k: 12
        density_k: 15
    # Ground-truth trajectory metrics logged to wandb for sweep ranking.
    - class_path: callbacks.dyngen_gt_metrics_callback.DyngenGroundTruthMetricsCallback
      init_args:
        every_n_epochs: 50
        pca_dim: 50
        time_key: pseudotime
        from_key: from
        to_key: to
        terminal_key: final_annotation
        fate_prefix: fate_prob_
        demap_landmarks: 1000
        demap_knn: 15
        prefix: gt
