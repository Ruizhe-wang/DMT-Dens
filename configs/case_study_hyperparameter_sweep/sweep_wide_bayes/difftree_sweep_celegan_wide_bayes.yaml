# Wide Bayesian hyperparameter search: proposed DiffTree/TopoBranch method on
# C. elegans only. Goal: find a materially better case-study configuration than
# the current one, whose density preservation is below baselines (the existing
# celegan run gives density_correlation ~0.747, under densMAP's 0.826).
#
# This is the WIDE-RANGE successor to
#   configs/case_study_hyperparameter_sweep/difftree_sweep_celegan.yaml
# which only varied 3 density knobs on a 24-run grid. Here we open up the loss
# weights, the optimization knobs, and the density terms together and let a
# Bayesian search explore the joint space.
#
# Run (folder is globbed by scripts/run_wandb_multidata.sh, so this file lives
# alone in sweep_wide_bayes/ to keep the base config out of the glob):
#   wandb sweep configs/case_study_hyperparameter_sweep/sweep_wide_bayes/difftree_sweep_celegan_wide_bayes.yaml
#   wandb agent <entity>/DiffTree_rz/<sweep_id>
# or paste the folder path
#   D:\ruizhe\mldr\configs\case_study_hyperparameter_sweep\sweep_wide_bayes
# into scripts/run_wandb_multidata.sh and run that.
#
# Base config: configs/case_study_hyperparameter_sweep/difftree_celegan.yaml
# Cost: ~1000 GPU epochs per run. Bayes runs until the agent is stopped, so cap
# the agent run count (the run_wandb.sh launcher controls concurrency/count).
#
# ---------------------------------------------------------------------------
# Optimization target
# ---------------------------------------------------------------------------
# We maximize val_density_svc_combined = 0.5*density_correlation + 0.5*svc_acc,
# an equal-weighted mean of density preservation and label separability. It is
# logged by callbacks.Eval_density.build_metric_log_payload (added there) so the
# single-metric Bayesian sweep can push both at once. This guards against the
# known failure mode where maximizing density_correlation alone collapses the
# class structure (and tanks SVC); requiring SVC to stay high keeps embeddings
# usable while lifting density.
#
# To re-weight, change the 0.5/0.5 split in build_metric_log_payload. To re-aim
# entirely, swap metric.name for one of the raw keys instead:
#   val_visible_density_correlation  (density only)
#   val_svc_acc                      (label separability only)
#   val_local_density_correlation    (local density fidelity)
#   val_score                        (structure-only: mean of knn/trust/dist_corr)
# When reading the table, still eyeball val_trust / val_knn to sanity-check the
# top runs.
# ---------------------------------------------------------------------------

program: main.py
method: bayes
project: DiffTree_rz
name: cs_hpsweep_difftree_celegan_wide_bayes

metric:
  name: val_density_svc_combined
  goal: maximize

parameters:
  config:
    value: configs/case_study_hyperparameter_sweep/difftree_celegan.yaml

  seed_everything:
    value: 42

  # NOTE: only knobs actually read by model.DiffTreeVQ_density.DMTEVT_model are
  # swept. These constructor args are DEAD in that model (default-only, never
  # read via self.hparams in the compute path) and are deliberately omitted --
  # sweeping them would just burn runs:
  #   weight_mse, weight_nepo   -> never referenced
  #   weightrout                -> never referenced
  #   sigma                     -> only used by _Similarity(), which is never called
  #   ec_ce_weight              -> only used by router_forward(), which is never called

  # --- Optimization knobs (base: lr 0.005, wd 1e-10, exag_lat 2, nu_lat 0.01,
  #     tau 1). exaggeration_lat/nu_lat are live indirectly: base config sets
  #     exaggeration_emb=-1 and nu_emb=-1, so the model copies the _lat value
  #     into the _emb value (DiffTreeVQ_density.py:131-133) which is then used. ---
  model.init_args.lr:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.02
  model.init_args.weight_decay:
    distribution: log_uniform_values
    min: 1.0e-12
    max: 1.0e-6
  model.init_args.exaggeration_lat:
    distribution: int_uniform
    min: 1
    max: 6
  model.init_args.nu_lat:
    distribution: log_uniform_values
    min: 0.001
    max: 0.5
  model.init_args.tau:
    distribution: uniform
    min: 0.2
    max: 3.0

  # --- Density terms (base: weight 0.001, k 12, anchors 256) ---
  # Widened well past the focused grid; useful region was ~0.003..0.02 but we
  # let bayes probe above and below to confirm the knee on celegan.
  model.init_args.density_weight:
    distribution: log_uniform_values
    min: 0.0005
    max: 0.05
  model.init_args.density_k:
    values: [8, 12, 15, 20, 25, 30]
  model.init_args.density_num_anchors:
    values: [256, 512, 1000]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
