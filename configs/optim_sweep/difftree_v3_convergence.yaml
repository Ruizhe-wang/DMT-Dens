# 收敛性 + 超参数 sweep
# ── 基于 epoch_sweep 实验结论 ──
# 1. Loss 在 ~5000 epoch 后收敛（0.0727→0.0722）
# 2. Consistency 指标在 3000 epoch 达到峰值，之后反而下降
#    (3000ep: fidelity=0.760, corr=0.697 vs 10000ep: fidelity=0.688, corr=0.641)
# 3. Cosine annealing 将 LR 衰减至 ~0，后期几乎无学习
# 4. 训练过长可能导致过拟合或 teacher EMA 退化
#
# ── Sweep 策略 ──
# - 固定 3000 epoch（epoch_sweep 最优点）
# - Sweep lr: 探索更高/更低学习率在 3000ep 下的表现
# - Sweep teacher_momentum: 在较短训练下，momentum 的最优值可能不同
# - Sweep lg_warmup_epochs: 与 3000ep 匹配的 warmup 比例
#
# 总实验数: 4 × 4 × 3 = 48 runs
program: main.py
method: grid
project: CONSISTENCY_EVAL
name: convergence_lr_momentum_sweep_v3

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]

  # === 核心 sweep 维度 ===

  # 学习率: baseline 0.005 在 3000ep 效果最好
  # 向两侧扩展，看能否进一步提升
  model.lr:
    values: [0.001, 0.005, 0.01, 0.02]

  # Teacher EMA momentum
  # 3000ep 比 10000ep 短很多，teacher 需要更快跟上 student
  # 偏低的 momentum 可能更适合短训练
  model.lg_teacher_momentum:
    values: [0.9, 0.95, 0.99, 0.999]

  # LG warmup: 3000ep 下的合理比例
  # 0 = 无 warmup, 10 ≈ 0.3%, 30 ≈ 1%, 对比 epoch_sweep 中的 0
  model.lg_warmup_epochs:
    values: [0, 10, 30]

  # === 固定参数 ===
  # 固定 3000 epoch（epoch_sweep 最优点）
  trainer.max_epochs:
    value: 3000
  model.max_epochs:
    value: 3000

  # 每 100 epoch 验证，细粒度跟踪收敛曲线
  trainer.check_val_every_n_epoch:
    value: 100

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
