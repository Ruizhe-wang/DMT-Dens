# =============================================================================
# UMAP Local-Global Consistency Evaluation
# =============================================================================
#
# Purpose: Analyze local-global consistency of UMAP dimensionality reduction
#
# Methodology:
#   - Global Embedding: UMAP fitted on ALL data
#   - Local Embedding:  Fresh UMAP fitted on SUBSET data
#   - Metrics: Fidelity, Trustworthiness, Distortion, Displacement
#
# Run: python main.py fit -c conf/consistency_eval/run_umap_consistency.yaml
# =============================================================================

seed_everything: 42

data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    pca_dim: 64
    batch_size: 60000          # Use full dataset in one batch for UMAP
    num_workers: 0             # Windows compatibility
    K: 200
    n_hop: 1
    data_path: data            # Local data path

# =============================================================================
# UMAP Model Configuration
# =============================================================================
# UMAP Hyperparameter Grids:
#   UMAP_NEIGHBORS = [10, 15, 20, 25]
#   UMAP_MIN_DIST = [0.01, 0.05, 0.08, 0.1, 0.15]
#
# Recommended settings for MNIST:
#   - n_neighbors=15 (p1=1): Balances local/global structure
#   - min_dist=0.1 (p2=3): Allows tight clustering without overlaps
# =============================================================================
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: '_umap'
    data_name: 'mnist'
    num_input_dim: 784
    n_components: 2
    p1: 1                      # n_neighbors=15
    p2: 3                      # min_dist=0.1
    p3: 0
    random_state: 42

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: umap_consistency_eval
      project: CONSISTENCY_EVAL
      save_dir: wandb

  callbacks:
    # ==========================================================================
    # Global Embedding Visualization (NEW)
    # Generates: scatter plot, per-class view, density plot for t-SNE/UMAP
    # ==========================================================================
    - class_path: callbacks.baseline_plot_callback.BaselinePlotCallback
      init_args:
        label_key: 'cell_type'
        output_dir: 'results_consistency/umap'
        downsample: 20000

    # ==========================================================================
    # Consistency Analysis Callback
    # Generates: comparison plots, distortion heatmap, displacement vectors
    # ==========================================================================
    - class_path: callbacks.consistency_callback.ConsistencyCallback
      init_args:
        label_key: 'cell_type'
        local_method: 'umap'
        label_sets:
          - [4, 9]                           # Often confused pair
          - [1, 7]                           # Similar strokes
          - [0, 6, 8, 9]                     # Round shapes
          - [3, 5, 8]                        # Curved digits

    # Standard Visualization Callback (DiffTree compatible, also works for baseline)
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: 'results_consistency/umap'

  max_epochs: 1                # Baseline methods only need 1 epoch
  devices: 1
  accelerator: cpu             # UMAP runs on CPU
  check_val_every_n_epoch: 1
  enable_checkpointing: false
  num_sanity_val_steps: 0
  limit_train_batches: 1       # Only one batch for full dataset
  limit_val_batches: 1
