# DiffTree v4 label scaling: size=2, labels=[1, 7]
# Run: python main.py fit -c configs/label_scaling_v4/diff_s2_1_7.yaml

seed_everything: 42
data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    pca_dim: 64
    batch_size: 4096
    num_workers: 8
    K: 200
    n_hop: 1
    data_path: data
model:
  class_path: model.DiffTreeVQ_v4.DMTEVT_model
  init_args:
    num_input_dim: 784
    T_hidden_size: 512
    T_num_layers: 3
    t_output_dim: 40
    num_use_moe: 1
    lr: 0.003
    weight_decay: 1.0e-5
    max_epochs: 2000
    num_use_mlevel_list: [0.3, 0.5, 0.8, 1.0, 2.0, 3.5]
    kernel_df: 1.0
    local_knn: 30
    fidelity_subset_size: 1024
    local_loss_weight: 1.0
    global_loss_weight: 1.0
    global_huber_weight: 0.25
    consistency_weight: 0.2
    variance_penalty_weight: 0.01
trainer:
  max_epochs: 2000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: difftree_v4_s2_1_7
      project: CONSISTENCY_EVAL
      save_dir: wandb
  callbacks:
  - class_path: callbacks.consistency_callback.ConsistencyCallback
    init_args:
      label_key: cell_type
      save_micro_ckpt: outputs/results/label_scaling_v4/difftree/s2_1_7
      layers: [0, 1, 2, 3, 4, 5]
      micro_training_epochs: 500
      micro_training_strategy: proportional
      label_sets:
      - [1, 7]
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: results_label_scaling_v4/difftree/s2_1_7
      every_n_epochs: 200
