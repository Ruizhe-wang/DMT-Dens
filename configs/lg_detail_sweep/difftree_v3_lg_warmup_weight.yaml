# - warmup 短 + weight 大：可能导致突然注入强 LG 信号引起震荡
# - warmup 长 + weight 小：LG loss 几乎不起作用
program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_warmup_weight_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]

  # Warmup 时长
  model.lg_warmup_epochs:
    values: [0, 5, 10, 20, 50]

  # LG loss 权重：从关闭到强监督
  model.lg_weight:
    values: [0.01, 0.05, 0.1, 0.3, 1.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
