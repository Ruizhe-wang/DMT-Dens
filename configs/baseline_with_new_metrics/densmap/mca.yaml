# Auto-generated; best p1/p2 applied. ASR/FR-DC are computed
# automatically by FidelityEvalCallback (no extra args needed).
seed_everything: 42
data:
  class_path: data_model.M1datamodel_mca.DMTBaseDataModule
  init_args:
    data_path: /zangzelin/data
    pca_dim: 64
    batch_size: 23341
    num_workers: 0
    K: 200
    n_hop: 1
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _densmap
    data_name: mca
    num_input_dim: 9120
    n_components: 2
    p1: 0
    p2: 1
    p3: 0
    random_state: 42
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: baseline_densmap_mca_newmetrics
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/plots/baseline_newmetrics_densmap_mca
      every_n_epochs: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
