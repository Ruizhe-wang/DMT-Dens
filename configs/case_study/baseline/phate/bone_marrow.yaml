seed_everything: 42
data:
  class_path: data_model.M1datamodel_cellrank_bone_marrow.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data/bone_marrow
    h5ad_file: bone_marrow.h5ad
    pca_dim: 64
    batch_size: 5000
    num_workers: 0
    K: 200
    n_hop: 1
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _phate
    data_name: bone_marrow
    num_input_dim: 2000
    n_components: 2
    p1: 2
    p2: 2
    p3: 0
    random_state: 42
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: baseline_phate_bone_marrow
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/plots/baseline_phate_bone_marrow
      every_n_epochs: 1
  - class_path: callbacks.bone_marrow_paper_plot_callback.BoneMarrowPaperPlotCallback
    init_args:
      output_dir: outputs/paper_figures/bone_marrow/phate
      every_n_epochs: 1
      method_name: PHATE
      layer: 0
      save_formats: [png, pdf, svg]
      save_table: true
      log_to_wandb: true
  - class_path: callbacks.xc_plot_heterogeneity.HeterogeneityPlotCallback
    init_args:
      output_dir: outputs/plots/baseline_phate_bone_marrow/heterogeneity
      every_n_epochs: 1
      target_label: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
