# [test-run] C. elegans case study -- TopoBranch + 6 baselines, ONE run each
# (seed 42), to verify the pipeline runs remotely and logs the new
# developmental-time trajectory metrics (gt/pseudotime_corr, gt/time_ordering_acc,
# gt/time_continuity, gt/demap) to W&B for download + analysis.
#
# TopoBranch runs on GPU (100-epoch smoke test); baselines run on CPU (1 epoch,
# non-parametric, so their metrics are final). The GT metrics are logged by
# callbacks.celegan_gt_metrics_callback, which imports
# tools/celegan_case_study/compute_metrics.py -- both are committed alongside.
#
# Launch: create the sweep from this file directly (the base configs live in the
# same folder, so do NOT point a *.yaml-glob launcher at the whole folder):
#   wandb sweep configs/case_study/celegan/test_run/sweep_testrun_celegan.yaml
# then start agents for the printed sweep id. (Requires a GPU host for the
# TopoBranch config.) Or just run each config directly with `python main.py fit -c <file>`.

program: main.py
method: grid
project: DiffTree_rz
name: cs_testrun_all_methods_celegan

parameters:
  config:
    values:
      - configs/case_study/celegan/test_run/celegan_topobranch_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_tsne_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_umap_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_densne_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_densmap_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_pacmap_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_phate_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_densmap_denslambda_celegan_testrun.yaml
      - configs/case_study/celegan/test_run/baseline_densne_denslambda_celegan_testrun.yaml

  seed_everything:
    values: [42]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
