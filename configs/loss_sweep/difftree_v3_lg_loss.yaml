program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_loss_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]
  
  model.lg_warmup_epochs:
    value: 20

  model.lg_weight:
    values: [0.0, 0.05, 0.1, 0.3, 1.0]

  model.lg_position_weight:
    values: [0.0, 0.2, 0.5, 1.0, 3.0]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
