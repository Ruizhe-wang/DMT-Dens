# Hyperparameter sweep: BASELINE methods on dynGen fate.
# Mirrors configs/case_study_hyperparameter_sweep/baseline_sweep_celegan.yaml, but
# points at the dynGen base configs (configs/dyngen/baseline/*) so each run is
# rankable against the dynGen ground truth (gt/* metrics logged by
# DyngenGroundTruthMetricsCallback) — rank by gt/topology_f1 + gt/demap together.
#
# Launch (per workflow_wandb_sweep): set
#   YAML_DIR="configs/dyngen/baseline/sweep"
# in scripts/run_wandb_multidata.sh, then run it. (This folder holds ONLY this
# sweep file, so the script's *.yaml glob launches exactly one sweep.)
#
# p1/p2 are method-specific grid indices defined in model.baseline_tri.DMTEVT_model:
#   t-SNE / densNE:
#     p1 = perplexity          [15, 30, 50, 80, 120, 200]
#     p2 = early_exaggeration  [4, 8, 12, 18, 24, 32]
#   UMAP / densMAP:
#     p1 = n_neighbors [10, 15, 20, 40, 80, 120]
#     p2 = min_dist    [0.001, 0.01, 0.05, 0.08, 0.15, 0.3]
#   PaCMAP:
#     p1 = n_neighbors          [10, 15, 20, 40, 80, 120]
#     p2 = (MN_ratio, FP_ratio) [(0.3,1.0),(0.5,1.0),(0.5,2.0),(1.0,2.0),(2.0,5.0),(3.0,8.0)]
#   PHATE:
#     p1 = knn   [5, 10, 15, 20, 40, 80]
#     p2 = decay [10, 20, 40, 80, 120, 160]
#
# Grid size: 6 methods x 6 (p1) x 6 (p2) = 216 runs (each is 1 CPU epoch).

program: main.py
method: grid
project: DiffTree_rz
name: dyngen_hpsweep_baselines

parameters:
  config:
    values:
      - configs/dyngen/baseline/baseline_tsne_dyngen.yaml
      - configs/dyngen/baseline/baseline_umap_dyngen.yaml
      - configs/dyngen/baseline/baseline_pacmap_dyngen.yaml
      - configs/dyngen/baseline/baseline_densmap_dyngen.yaml
      - configs/dyngen/baseline/baseline_densne_dyngen.yaml
      - configs/dyngen/baseline/baseline_phate_dyngen.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4, 5]

  model.init_args.p2:
    values: [0, 1, 2, 3, 4, 5]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
