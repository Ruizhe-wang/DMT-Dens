# E03: improve aggregation, token resolution and depth after E02.
#
# Each variant changes one architecture axis from an E02 winner. All receive
# the same learning-rate grid. Batch, seed, epochs, objective, projection head,
# augmentation, sampling, losses and callbacks remain fixed.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e03_structure_seed42

parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e03/runs/ng20_ft_transformer_wide_attention_lr0p005.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_ft_transformer_wide_attention_lr0p001.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_ft_transformer_wide_attention_lr0p0003.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_wide_r16_attention_lr0p005.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_wide_r16_attention_lr0p001.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_wide_r16_attention_lr0p0003.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_m32_r16_lr0p005.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_m32_r16_lr0p001.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_m32_r16_lr0p0003.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_r16_l3_lr0p005.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_r16_l3_lr0p001.yaml
      - configs/encoder_bench/sweep_e03/runs/ng20_latent_transformer_r16_l3_lr0p0003.yaml

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
