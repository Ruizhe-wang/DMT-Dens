# DiffTree density_weight sweep on BOTH branch3d lineage datasets.
# Purpose: fix the stretched dense root -- density_weight is the #1 lever
# (Bayesian sweep: Spearman +0.74 with global/trajectory structure). Too low
# (<=0.01) lets the trajectory/exaggeration forces smear the dense root into a
# 1-D arc; the swept optimum on dyngen was ~0.045, but the best value for THIS
# data may differ, and too high can over-compact / produce a fan. Sweep to find it.
#
# 2 datasets x 4 density_weight = 8 GPU runs; each emits a clean no-background
# 2D embedding (PaperEmbeddingCallback) for visual inspection of the root.
#
# Launch: set YAML_DIR to a folder containing only this file in
#         scripts/run_wandb_multidata.sh, then bash scripts/run_wandb_multidata.sh

program: main.py
method: grid
project: DiffTree_rz
name: branch3d_difftree_density_weight

parameters:
  config:
    values:
      - configs/branch3d/star/difftree.yaml
      - configs/branch3d/hierarchy/difftree.yaml
  model.init_args.density_weight:
    values: [0.02, 0.045, 0.09, 0.15]
  seed_everything:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
