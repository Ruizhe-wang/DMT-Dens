# [5seed-baked] tsne celegan at BEST config (p1=3, p2=0).
# Used by appendix_sweeps/sweep_all_baselines_best_5seed_celegan.yaml; only random_state is swept.
# Base config for the t-SNE baseline on C. elegans, used by the case-study
# hyperparameter sweep. p1/p2 are overridden by the sweep driver
# (case_study_hyperparameter_sweep/baseline_sweep_celegan.yaml).
#   p1 = perplexity        [15, 30, 50, 80, 120, 200]
#   p2 = early_exaggeration [4, 8, 12, 18, 24, 32]
seed_everything: 42
data:
  class_path: data_model.M1datamodel_celegan.DMTBaseDataModule
  init_args:
    data_path: /usr/storage/ruizhe/zangzelin/data
    pca_dim: 64
    batch_size: 54649
    num_workers: 0
    K: 50
    n_hop: 1
    include_time_label: true
    exclude_unannotated: true
    standardize: true
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: _tsne
    data_name: celegan
    num_input_dim: 2766
    n_components: 2
    p1: 3
    p2: 0
    p3: 0
    random_state: null
trainer:
  max_epochs: 1
  accelerator: cpu
  devices: 1
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: cs_5seed_tsne_celegan
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/case_study_hpsweep/celegan/tsne
      every_n_epochs: 1
  - class_path: callbacks.xc_plot_heterogeneity.HeterogeneityPlotCallback
    init_args:
      output_dir: outputs/case_study_hpsweep/celegan/tsne/heterogeneity
      every_n_epochs: 1
      target_label: 1
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 1
      down_sample: 3000
      knn_k: 12
      density_k: 15
  - class_path: callbacks.paper_embedding_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/paper_embeddings/case_study_5seed/tsne/celegan
      dataset_name: CELEGAN
      method_name: t-SNE
      every_n_epochs: 1
      max_plot_samples: 100000
      save_formats:
        - png
        - pdf
      scale_down_factor: 3.0
      dpi: 800
      base_point_size: 1.2
      min_point_size: 0.5
      alpha: 0.6
      edge_color: none
