# =============================================================================
# t-SNE Local-Global Consistency Evaluation
# =============================================================================
#
# Purpose: Analyze local-global consistency of t-SNE dimensionality reduction
#
# Methodology:
#   - Global Embedding: t-SNE fitted on ALL data
#   - Local Embedding:  Fresh t-SNE fitted on SUBSET data
#   - Metrics: Fidelity, Trustworthiness, Distortion, Displacement
#
# Run: python main.py fit -c conf/consistency_eval/run_tsne_consistency.yaml
# =============================================================================

seed_everything: 42

data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    pca_dim: 64
    batch_size: 60000          # Use full dataset in one batch for t-SNE
    num_workers: 0             # Windows compatibility
    K: 200
    n_hop: 1
    data_path: data            # Local data path

# =============================================================================
# t-SNE Model Configuration
# =============================================================================
# t-SNE Hyperparameter Grids:
#   TSNE_PERPLEXITY = [20, 25, 30, 35]
#   TSNE_EXAGGERATION = [8, 10, 12, 14, 16]
#
# Recommended settings for MNIST:
#   - perplexity=30 (p1=2): Good balance for ~60k samples
#   - early_exaggeration=12 (p2=2): Standard value for clear clusters
# =============================================================================
model:
  class_path: model.baseline_tri.DMTEVT_model
  init_args:
    method: '_tsne'
    data_name: 'mnist'
    num_input_dim: 784
    n_components: 2
    p1: 2                      # perplexity=30
    p2: 2                      # early_exaggeration=12
    p3: 0
    random_state: 42

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: tsne_consistency_eval
      project: CONSISTENCY_EVAL
      save_dir: wandb

  callbacks:
    # ==========================================================================
    # Global Embedding Visualization (NEW)
    # Generates: scatter plot, per-class view, density plot for t-SNE/UMAP
    # ==========================================================================
    - class_path: callbacks.baseline_plot_callback.BaselinePlotCallback
      init_args:
        label_key: 'cell_type'
        output_dir: 'results_consistency/tsne'
        downsample: 20000
        label_sets:
          - [4, 9]                           # Often confused pair
          - [1, 7]                           # Similar strokes
          - [0, 6, 8, 9]                     # Round digits
          - [3, 5, 8]                        # Curved digits

    # ==========================================================================
    # Consistency Analysis Callback
    # Generates: comparison plots, distortion heatmap, displacement vectors
    # ==========================================================================
    - class_path: callbacks.consistency_callback.ConsistencyCallback
      init_args:
        label_key: 'cell_type'
        local_method: 'tsne'
        # Label sets to analyze for consistency
        label_sets:
          - [4, 9]                           # Often confused pair
          - [1, 7]                           # Similar strokes
          - [0, 6, 8, 9]                     # Round digits
          - [3, 5, 8]                        # Curved digits

    # Standard Visualization Callback (DiffTree compatible, also works for baseline)
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: 'results_consistency/tsne'

  max_epochs: 1                # Baseline methods only need 1 epoch
  devices: 1
  accelerator: cpu             # t-SNE runs on CPU
  check_val_every_n_epoch: 1
  enable_checkpointing: false
  num_sanity_val_steps: 0
  limit_train_batches: 1       # Only one batch for full dataset
  limit_val_batches: 1
