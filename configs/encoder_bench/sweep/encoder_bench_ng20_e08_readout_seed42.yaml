# E08: pure Transformers with nonlinear post-pooling readout, NG20 seed 42.
# Six runs: two encoders x the fixed three-learning-rate grid.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e08_readout_seed42
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e08/runs/ng20_ft_transformer_d96_readout1024_512_lr0p005.yaml
      - configs/encoder_bench/sweep_e08/runs/ng20_ft_transformer_d96_readout1024_512_lr0p001.yaml
      - configs/encoder_bench/sweep_e08/runs/ng20_ft_transformer_d96_readout1024_512_lr0p0003.yaml
      - configs/encoder_bench/sweep_e08/runs/ng20_latent_transformer_m32_d192_r16_readout512_256_lr0p005.yaml
      - configs/encoder_bench/sweep_e08/runs/ng20_latent_transformer_m32_d192_r16_readout512_256_lr0p001.yaml
      - configs/encoder_bench/sweep_e08/runs/ng20_latent_transformer_m32_d192_r16_readout512_256_lr0p0003.yaml
