# Generated by configs/encoder_bench/case_study_latent_5seed/generate_configs.py
# Case-study run: celegan, latent-bn, profile=native, seed 42.
# Data sampling remains fixed at seed 42 to match the existing paper baseline.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_celegan.DMTBaseDataModule
  init_args:
    data_path: data
    pca_dim: 64
    seed: 42
    sample_data_size: 54649
    batch_size: 1000
    num_workers: 4
    K: 50
    n_hop: 1
    include_time_label: true
    exclude_unannotated: true
    standardize: true
model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 2766
    num_train_data: 54649
    lr: 0.001
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.01
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 1000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: false
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-06
    t_mul: 1.0
    num_use_mlevel_list:
    - 1
    density_weight: 0.01
    density_k: 12
    density_num_anchors: 1000
    encoder_type: latent_transformer
    encoder_kwargs:
      num_latents: 32
      d_token: 224
      num_layers: 2
      num_heads: 4
      ffn_ratio: 4.0
      dropout: 0.0
      attn_dropout: 0.0
      latent_rank: 16
      pooling: mean
      final_norm: true
      input_norm: batchnorm
      force_mem_efficient: true
trainer:
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/logs
      name: latent-bn_native_celegan_seed42
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: outputs/encoder_case_study/latent_bn/native/celegan/seed42/checkpoints
      filename: latent-bn_native_celegan_seed42-{epoch:04d}
      save_last: true
      every_n_epochs: 100
      save_top_k: 0
  - class_path: callbacks.xc_plot_callback.VisualizationCallback
    init_args:
      output_dir: outputs/encoder_case_study/latent_bn/native/celegan/seed42/diagnostics
      every_n_epochs: 50
      save_embeddings: false
      embedding_method_name: latent-bn
  - class_path: callbacks.case_study_callback.VisualizationCallback
    init_args:
      output_dir: outputs/encoder_case_study/latent_bn/native/celegan/seed42/paper
      dataset_name: CELEGAN
      method_name: TopoBranch latent-bn
      every_n_epochs: 50
      max_plot_samples: 100000
      save_formats:
      - png
      - pdf
      dpi: 800
      point_size: 4.5
      alpha: 0.9
      panel_prefix: case_study_5seed
      time_vmin: 50
      time_vmax: 750
      show_colorbar: true
      save_legend: true
  - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
    init_args:
      dataset_name: celegan_seed42
      output_dir: outputs/encoder_case_study/latent_bn/native/celegan/seed42/embeddings
      save_format: both
      embedding_method_name: latent-bn
  - class_path: callbacks.Eval_density.FidelityEvalCallback
    init_args:
      every_n_epochs: 50
      down_sample: 3000
      knn_k: 12
      density_k: 15
  - class_path: callbacks.celegan_gt_metrics_callback.CeleganGroundTruthMetricsCallback
    init_args:
      every_n_epochs: 50
      pca_dim: 50
      time_key: embryo_time_numeric
      knn: 15
      demap_landmarks: 1000
      demap_knn: 15
      prefix: gt
  - class_path: callbacks.runtime_profiler.RuntimeProfilerCallback
    init_args:
      output_path: results/encoder_case_study/latent-bn_native_celegan_seed42/runtime.csv
  - class_path: callbacks.encoder_benchmark.EncoderBenchmarkCallback
    init_args:
      tail_epochs: 20
      cv_threshold: 0.25
      direction_change_threshold: 0.5
      spike_ratio_threshold: 3.0
      check_grad_every_n_steps: 50
  - class_path: callbacks.runtime_info_callback.RuntimeInfoCallback
    init_args:
      output_dir: outputs/encoder_case_study/latent_bn/native/celegan/seed42/runtime_info
