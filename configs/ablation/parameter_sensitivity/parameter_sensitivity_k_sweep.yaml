program: main.py
method: grid
project: DiffTree_rz
name: density_k_sensitivity_lambda0018_512_5seed

parameters:
  config:
    values:
      - configs/ablation/component/gast10k_full.yaml
      - configs/ablation/component/hcl_full.yaml
      - configs/ablation/component/mca_full.yaml
      - configs/ablation/component/ng20_full.yaml
  seed_everything:
    values: [42, 43, 44, 45, 46]
  model.init_args.density_weight:
    values: [0.0018]
  model.init_args.density_k:
    values: [5, 10, 15, 20, 25, 30, 40, 50]
  model.init_args.density_num_anchors:
    values: [512]
  model.init_args.density_scale_mode:
    values: [multi]
  model.init_args.max_epochs:
    values: [1000]
  trainer.max_epochs:
    values: [1000]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
