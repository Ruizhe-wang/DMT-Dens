# Capacity control for the FT-Transformer on NG20, seeds 42/43/44.
#
# The question this answers: is the FT-Transformer's failure caused by having
# only 3% of the baseline parameter count, or by per-feature tokenization
# itself?
#
# Everything except d_token is held fixed - same batch 4096, same lr 5e-3, same
# depth, same heads, same seeds, same code (3f03455 or later). Only the width
# changes, and width is where the capacity is: about 76% of an FT-Transformer's
# parameters sit in the blocks, which scale as 24*d^2.
#
#   d_token=32   33,304 params  0.03x baseline  (the protocol setting, already run)
#   d_token=64  ~114,000 params  0.10x baseline  (this sweep)
#   d_token=96   247,128 params  0.22x baseline  (this sweep)
#
# d_token=64 is the decisive one. It lands within a percent of
# latent_transformer's 114,296 parameters, at the same width, depth and head
# count, so the only remaining difference between the two is how the input is
# turned into tokens: one token per feature versus a low-rank map to 16 latents.
# latent_transformer at that size trains cleanly on all three seeds
# (density 0.583 +- 0.008, no collapse). If per-feature tokenization at the same
# size still collapses, capacity is not the explanation.
#
# True parameter matching at 0.5-2x is not reachable here: d_token=128 and above
# OOM at the aligned batch on an 11 GB card, and shrinking the batch for the
# FT-Transformer alone would break the comparison it is meant to settle.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_capacity_control

parameters:
  config:
    values:
      - configs/encoder_bench/ng20_ft_transformer_d64.yaml
      - configs/encoder_bench/ng20_ft_transformer_d96.yaml
  seed_everything:
    values:
      - 42
      - 43
      - 44

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
