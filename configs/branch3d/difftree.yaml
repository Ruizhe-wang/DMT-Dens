# DiffTree on the diverse-density 3D branching dataset.
# Includes PaperEmbeddingCallback -> clean, no-background 2D embedding for the paper.
# Run: python main.py fit -c configs/branch3d/difftree.yaml
seed_everything: 42

data:
  class_path: data_model.M1datamodel_tree.DMTBaseDataModule
  init_args:
    data_path: data/synthetic_branch3d
    dataset_file: branch3d_diverse_density.mat
    data_name: branch3d
    data_key: M
    label_key: C
    pca_dim: 3
    batch_size: 4096
    num_workers: 8
    K: 30
    n_hop: 1

model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 3
    num_train_data: 10600
    lr: 0.005
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.01
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 600
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 600
    step2_r_epoch: 600
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.35
    exp_min: 1.0e-6
    t_mul: 1.0
    num_use_mlevel_list: [1]
    density_weight: 0.01
    density_k: 8
    density_num_anchors: 1024

trainer:
  max_epochs: 600
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: branch3d_difftree
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/checkpoints/branch3d_difftree
        filename: "branch3d-difftree-{epoch:04d}"
        save_last: true
        every_n_epochs: 100
    - class_path: callbacks.xc_paper_embedding_callback.PaperEmbeddingCallback
      init_args:
        output_dir: outputs/paper_embeddings/branch3d/difftree
        method_name: difftree
        every_n_epochs: 50
        density_npz: data/synthetic_branch3d/branch3d_diverse_density.npz
    - class_path: callbacks.xc_save_consolidated_embeddings.SaveConsolidatedEmbeddingsCallback
      init_args:
        dataset_name: branch3d
        output_dir: outputs/embeddings
        save_format: both
        embedding_method_name: difftree
