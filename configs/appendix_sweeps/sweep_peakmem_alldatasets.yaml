# Peak GPU memory sweep: every benchmark dataset, one run each.
#
# Runs TopoBranch (DiffTreeVQ_density) on each *_full dataset config for a few
# training batches and records the training peak GPU memory. The command:
#   * shortens the run (max_epochs=1, limit_train_batches=15, no validation)
#   * REPLACES the config callbacks with callbacks.peakmem_print.PeakMemPrint,
#     which drops ModelCheckpoint / viz / eval callbacks (clean training peak,
#     no checkpoint conflict) and logs gpu_peak_mem_mb to the wandb run summary.
# Each wandb run is named per dataset (from each config's logger), so the peak
# memory is read straight from the wandb run summary field `gpu_peak_mem_mb`.
#
# Requires callbacks/peakmem_print.py to be present in the repo.
#
# Run (your usual flow):
#   wandb sweep configs/appendix_sweeps/sweep_peakmem_alldatasets.yaml
#   wandb agent <entity>/DiffTree_rz/<sweep_id>
# or point scripts/run_wandb_multidata.sh at a folder containing just this file.

program: main.py
method: grid
project: DiffTree_rz
name: peakmem_alldatasets

parameters:
  config:
    values:
      - configs/ablation/component/act_full.yaml
      - configs/ablation/component/aqc_full.yaml
      - configs/ablation/component/emnist_full.yaml
      - configs/ablation/component/epi_full.yaml
      - configs/ablation/component/gast10k_full.yaml
      - configs/ablation/component/hcl_full.yaml
      - configs/ablation/component/mca_full.yaml
      - configs/ablation/component/ng20_full.yaml
      - configs/ablation/component/tree_full.yaml

  seed_everything:
    value: 42

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
  - --trainer.max_epochs=1
  - --trainer.limit_train_batches=15
  - --trainer.limit_val_batches=0
  - --trainer.num_sanity_val_steps=0
  - --trainer.enable_checkpointing=false
  - --trainer.callbacks=callbacks.peakmem_print.PeakMemPrint
