program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lg_warmup_momentum_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]
  model.lg_warmup_epochs:
    values: [0, 5, 10, 20, 50]

  # Teacher EMA momentum: controls teacher update speed
  # - Lower: teacher adapts faster → noisier supervision
  # - Higher: teacher changes slowly → more stable but possibly stale
  model.lg_teacher_momentum:
    values: [0.9, 0.95, 0.99, 0.999]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
