# E05: feature-specific FT pooling and statistical latent pooling.
#
# FT flatten pooling reaches parameter parity without increasing the attention
# token width. Latent mean+std pooling exposes token dispersion as an explicit
# density cue. All other training and model components remain fixed, and every
# variant receives the same learning-rate grid.
program: main.py
method: grid
project: TopoBranch_encoder_bench_NG20
name: encoder_bench_ng20_e05_pooling_capacity_seed42

parameters:
  config:
    values:
      - configs/encoder_bench/sweep_e05/runs/ng20_ft_transformer_wide_flatten_lr0p005.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_ft_transformer_wide_flatten_lr0p001.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_ft_transformer_wide_flatten_lr0p0003.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_wide_r16_mean_std_lr0p005.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_wide_r16_mean_std_lr0p001.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_wide_r16_mean_std_lr0p0003.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_m32_r16_mean_std_lr0p005.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_m32_r16_mean_std_lr0p001.yaml
      - configs/encoder_bench/sweep_e05/runs/ng20_latent_transformer_m32_r16_mean_std_lr0p0003.yaml

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
