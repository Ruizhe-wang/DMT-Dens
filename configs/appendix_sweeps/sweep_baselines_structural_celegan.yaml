# [1/3] Celegan baseline sweep -- ALL baseline methods, structural params.
#
# 6 methods x p1 x p2 = 216 runs (1 CPU epoch each). Each method at its DEFAULT
# density strength; the density-strength (dens_lambda) axis is the separate
# sweep_baselines_denslambda_celegan.yaml in this folder.
#
# p1/p2 grids (model.baseline_tri.DMTEVT_model):
#   t-SNE / densNE : p1=perplexity[15,30,50,80,120,200]  p2=early_exag[4,8,12,18,24,32]
#   UMAP / densMAP : p1=n_neighbors[10,15,20,40,80,120]   p2=min_dist[0.001,0.01,0.05,0.08,0.15,0.3]
#   PaCMAP         : p1=n_neighbors                         p2=(MN,FP) ratios
#   PHATE          : p1=knn[5,10,15,20,40,80]               p2=decay[10,20,40,80,120,160]
#
# Base configs referenced below live in configs/case_study_hyperparameter_sweep/
# (intentionally NOT in this folder, so run_wandb_multidata.sh's *.yaml loop does
# not try to `wandb sweep` them).

program: main.py
method: grid
project: DiffTree_rz
name: cs_hpsweep_baselines_structural_celegan

parameters:
  config:
    values:
      - configs/case_study_hyperparameter_sweep/baseline_tsne_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_umap_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_pacmap_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densmap_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_densne_celegan.yaml
      - configs/case_study_hyperparameter_sweep/baseline_phate_celegan.yaml

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4, 5]

  model.init_args.p2:
    values: [0, 1, 2, 3, 4, 5]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
