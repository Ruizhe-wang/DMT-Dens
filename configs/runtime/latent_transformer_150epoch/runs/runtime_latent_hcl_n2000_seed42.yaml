# Generated by configs/runtime/latent_transformer_150epoch/generate_configs.py
# Dataset=hcl, N=2000, training_seed=42, data_seed=42, epochs=150.
seed_everything: 42
data:
  class_path: data_model.M1datamodel_runtime_hcl.DMTBaseDataModule
  init_args:
    data_path: data
    pca_dim: 64
    seed: 42
    sample_data_size: 2000
    batch_size: 2000
    num_workers: 8
    K: 200
    n_hop: 1
model:
  class_path: model.DiffTreeVQ_density.DMTEVT_model
  init_args:
    num_input_dim: 3038
    num_train_data: 2000
    lr: 0.001
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.01
    nu_emb: -1
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 150
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 1000
    step2_r_epoch: 1000
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.95
    exp_b: 0.4
    exp_min: 1.0e-06
    t_mul: 1.0
    num_use_mlevel_list:
    - 1
    density_weight: 0.0018
    density_k: 12
    density_num_anchors: 512
    encoder_type: latent_transformer
    encoder_kwargs:
      num_latents: 32
      d_token: 224
      num_layers: 2
      num_heads: 4
      ffn_ratio: 4.0
      dropout: 0.0
      attn_dropout: 0.0
      latent_rank: 16
      pooling: mean
      final_norm: true
      input_norm: batchnorm
      force_mem_efficient: true
trainer:
  max_epochs: 150
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: false
  check_val_every_n_epoch: 1000
  num_sanity_val_steps: 0
  log_every_n_steps: 500
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/logs
      name: runtime_latent_hcl_n2000_seed42
  callbacks:
  - class_path: callbacks.runtime_profiler.RuntimeProfilerCallback
    init_args:
      output_path: results/runtime/latent_transformer_150epoch/runtime_latent_hcl_n2000_seed42/runtime.csv
  - class_path: callbacks.runtime_info_callback.RuntimeInfoCallback
    init_args:
      output_dir: outputs/runtime/latent_transformer_150epoch/runtime_latent_hcl_n2000_seed42/runtime_info
  limit_val_batches: 0
