program: main.py
method: grid
project: CONSISTENCY_EVAL
name: lr_wd_sweep_difftree_v3_mnist

parameters:
  config:
    values:
      - 'configs/label_scaling_v3/diff_s2_1_7.yaml'
  data.batch_size:
    values: [6500]

  model.num_use_mlevel_list:
    value: [0.8, 1, 1.5]
  model.lg_warmup_epochs:
    value: 20

  # Learning rate: from conservative to aggressive
  # Baseline = 0.005
  model.lr:
    values: [0.0005, 0.001, 0.005, 0.01, 0.05]

  # Weight decay: from near-zero to moderate L2 regularization
  # Baseline = 1e-10 (effectively none)
  model.weight_decay:
    values: [1.0e-10, 1.0e-06, 1.0e-04, 1.0e-02]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
