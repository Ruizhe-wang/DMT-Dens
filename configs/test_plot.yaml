# Minimal config to test plotting callbacks (fast: ~5 epochs)
# Run: python main.py fit -c configs/test_plot.yaml

seed_everything: 42

data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    pca_dim: 64
    batch_size: 5000
    num_workers: 8
    K: 200
    n_hop: 1
    data_path: data

model:
  class_path: model.DiffTreeVQ_v3.DMTEVT_model
  init_args:
    num_input_dim: 784
    T_hidden_size: 512
    T_num_layers: 3
    t_output_dim: 40
    tree_depth: 10
    num_use_moe: 1
    lr: 0.005
    weight_decay: 0.0000000001
    nu_lat: 0.01
    nu_emb: -1
    exaggeration_lat: 2
    exaggeration_emb: -1
    loss_type: 'G'
    all_g_l_weight: 0.95
    ec_ce_weight: 2
    exp_b: 0.4
    exp_min: 1e-6
    max_epochs: 5
    step2_epoch: 1000
    step2_r_epoch: 1000
    sample_rate_feature: 1.00
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    num_use_mlevel_list: [0.5, 1, 5]

trainer:
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: test
      project: CONSISTENCY_EVAL
      save_dir: wandb

  callbacks:
    # xc_plot_callback
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: 'test_output'

    - class_path: callbacks.consistency_callback.ConsistencyCallback
      init_args:
        label_key: 'cell_type'
        label_sets:
          - [1, 7]
        layers: [0,1,2]
        micro_training_epochs: 5

  max_epochs: 5
  devices: 1
  accelerator: gpu
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  enable_checkpointing: false
