# Supplementary baseline hyperparameter search for the 3 datasets missing from the
# 2026-06-25 export: tree (ArtificialTree), epi, act.
#
# Grid: p1 x p2 = 5 x 5 = 25 configs per (method, dataset), single seed (42),
# matching the existing 25-config export so the selection is comparable.
# 6 methods x 3 datasets x 25 = 450 runs.
#
# Run:
#   wandb sweep configs/baseline_with_new_metrics/baseline_hparam_sweep_tree_epi_act.yaml
#   wandb agent <entity>/DiffTree_rz/<sweep_id>
#
# Then EXPORT the runs INCLUDING the model.init_args.p1 / model.init_args.p2 columns and:
#   python select_best_hparams.py <new_export>.csv     # appends tree/epi/act
#   python apply_best_hparams.py best_hparams.csv        # patches the 18 default configs
#
# These reference the original (non new-metrics) base configs: the search only needs
# density_correlation + svc_accuracy to select the best config, not ASR/FR-DC.

program: main.py
method: grid
project: DiffTree_rz
name: baseline_hparam_sweep_tree_epi_act

parameters:
  config:
    values:
      - 'configs/dmtme_dataset_baselines/tsne/tree.yaml'
      - 'configs/dmtme_dataset_baselines/tsne/epi.yaml'
      - 'configs/dmtme_dataset_baselines/tsne/act.yaml'
      - 'configs/dmtme_dataset_baselines/umap/tree.yaml'
      - 'configs/dmtme_dataset_baselines/umap/epi.yaml'
      - 'configs/dmtme_dataset_baselines/umap/act.yaml'
      - 'configs/dmtme_dataset_baselines/pacmap/tree.yaml'
      - 'configs/dmtme_dataset_baselines/pacmap/epi.yaml'
      - 'configs/dmtme_dataset_baselines/pacmap/act.yaml'
      - 'configs/dmtme_dataset_baselines/phate/tree.yaml'
      - 'configs/dmtme_dataset_baselines/phate/epi.yaml'
      - 'configs/dmtme_dataset_baselines/phate/act.yaml'
      - 'configs/dmtme_dataset_baselines/densmap/tree.yaml'
      - 'configs/dmtme_dataset_baselines/densmap/epi.yaml'
      - 'configs/dmtme_dataset_baselines/densmap/act.yaml'
      - 'configs/dmtme_dataset_baselines/denssne/tree.yaml'
      - 'configs/dmtme_dataset_baselines/denssne/epi.yaml'
      - 'configs/dmtme_dataset_baselines/denssne/act.yaml'

  seed_everything:
    value: 42

  model.init_args.random_state:
    value: 42

  model.init_args.p1:
    values: [0, 1, 2, 3, 4]

  model.init_args.p2:
    values: [0, 1, 2, 3, 4]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - fit
  - ${args}
