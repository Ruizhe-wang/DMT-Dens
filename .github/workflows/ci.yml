name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-assets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy==1.26.4" "PyYAML>=6,<7" "pytest>=8,<9"
      - name: Validate publication assets
        run: python -m pytest -q tests/test_publication_assets.py
      - name: Compile public Python sources
        run: >-
          python -m compileall -q
          main.py model data_model callbacks eval scripts tools tests
