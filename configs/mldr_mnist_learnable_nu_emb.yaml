seed_everything: 42

data:
  class_path: data_model.M1datamodel_mnist_v2.DMTBaseDataModule
  init_args:
    data_path: data
    pca_dim: 64
    batch_size: 4096
    num_workers: 8
    K: 200
    n_hop: 1

model:
  class_path: model.mldr.DMTEVT_model
  init_args:
    num_input_dim: 784
    num_train_data: 60000
    lr: 0.003
    weight_decay: 1.0e-10
    sigma: 0.05
    sample_rate_feature: 1.0
    exaggeration_lat: 2
    exaggeration_emb: -1
    weight_mse: 2
    weight_nepo: 1
    nu_lat: 0.002
    nu_emb: 0.1
    learnable_nu_emb: true
    nu_emb_min: 1.0e-6
    weight_nu_emb_anchor: 0.02
    weight_anti_collapse: 0.05
    anti_collapse_k: 5
    anti_collapse_margin: 0.15
    tau: 1
    T_num_layers: 3
    T_num_attention_heads: 6
    T_hidden_size: 512
    T_intermediate_size: 300
    t_output_dim: 40
    T_hidden_dropout_prob: 0.1
    T_attention_probs_dropout_prob: 0.1
    ckpt_path: null
    use_orthogonal: false
    num_use_moe: 1
    vis_dim: 2
    trans_out_dim: 50
    max_epochs: 2000
    ec_ce_weight: 2
    n_neg_sample: 4
    test_noise: false
    training_str: step1
    tree_depth: 10
    n_timestep: 1000
    epoch_num_base: 0
    validate_bool: false
    weight_e_latent: 0.25
    step2_epoch: 3000
    step2_r_epoch: 3000
    use_tree_rout: true
    gen_data_bool: false
    weightrout: 0.1
    loss_type: G
    all_g_l_weight: 0.7
    exp_b: 0.2
    exp_min: 1.0e-6
    t_mul: 1.0
    num_use_mlevel_list: [1]

trainer:
  max_epochs: 2000
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  benchmark: true
  enable_checkpointing: true
  check_val_every_n_epoch: 50
  num_sanity_val_steps: 0
  log_every_n_steps: 500
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: mldr_mnist_learnable_nu_emb
      project: DiffTree_rz
      save_dir: wandb
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/checkpoints/mldr_mnist_learnable_nu_emb
        filename: "mldr-learnable-nu-{epoch:04d}"
        save_last: true
        every_n_epochs: 100
    - class_path: callbacks.xc_plot_callback.VisualizationCallback
      init_args:
        output_dir: outputs/plots/mldr_mnist_learnable_nu_emb
        every_n_epochs: 100
    - class_path: callbacks.xc_plot_heterogeneity.HeterogeneityPlotCallback
      init_args:
        output_dir: outputs/plots/mldr_mnist_learnable_nu_emb/heterogeneity
